<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitten Crossing</title>
<meta name="theme-color" content="#D9F2D0">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Toddler game: a road with a zebra crossing (canvas) and two big buttons along the bottom: STOP (kittens cross)
   and GO (cars drive). No words needed. Single bright look by design. */
body { background: #CDEBC2; }
.middle { flex: 1; }
.controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--cream); border-top: 4px solid var(--ink);
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: flex; gap: 28px; justify-content: center;
}
.light {
  width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink), var(--soft); cursor: pointer; padding: 0;
  display: grid; place-items: center; opacity: .55;
}
.light svg { width: 60px; height: 60px; }
.light.stop { background: #FF5A5F; }
.light.go { background: #3FC46A; }
.light[aria-pressed="true"] { opacity: 1; transform: translateY(-3px); box-shadow: 0 9px 0 var(--ink), 0 0 0 7px rgba(255,255,255,.8), var(--soft); }
.light.nudge:not([aria-pressed="true"]) { animation: nudge 1.1s ease-in-out infinite; opacity: .9; }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateY(-7px) scale(1.06); } }
.light:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink), var(--soft); }
@media (max-width: 420px) { .light { width: 84px; height: 84px; } .light svg { width: 52px; height: 52px; } }
@media (prefers-reduced-motion: reduce) { .light.nudge:not([aria-pressed="true"]) { animation: none; outline: 5px dashed var(--sun); outline-offset: 4px; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="A road with a zebra crossing. Press the red button to stop the cars so the kittens can cross, and the green button to let the cars go."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle"></div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="controls" id="controls">
  <button class="light stop" id="stopBtn" type="button" aria-label="Stop the cars: kittens cross" aria-pressed="false">
  </button>
  <button class="light go" id="goBtn" type="button" aria-label="Let the cars go" aria-pressed="true">
    <svg viewBox="0 0 60 60"><path d="M8 38 V30 L16 28 L22 18 H38 L46 28 L52 30 V38 Z" fill="#fff" stroke="#2A2340" stroke-width="3.2" stroke-linejoin="round"/><path d="M24 21 H36 L41 28 H20 Z" fill="#BFE6FF" stroke="#2A2340" stroke-width="2.4" stroke-linejoin="round"/><circle cx="19" cy="39" r="6" fill="#3D3650" stroke="#2A2340" stroke-width="2.6"/><circle cx="41" cy="39" r="6" fill="#3D3650" stroke="#2A2340" stroke-width="2.6"/></svg>
  </button>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/draw.js"></script>
<script src="game.js"></script>
</body>
</html>
