<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Laser Bounce</title>
<meta name="theme-color" content="#2E2A4F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* A light puzzle for older kids: tap mirrors to turn them so the laser dot bounces to every sleeping cat. Later
   levels add glass that splits the beam, fixed mirrors, and loose mirrors to drag in from the tray below.
   One canvas for the room; the top bar holds the level picker. Single evening look by design. */
body { background: #2E2A4F; }
.middle { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
.step { width: 40px; height: 40px; }
.step:disabled { opacity: .35; cursor: default; }
.step svg { width: 22px; height: 22px; }
.say { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 6; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: 90vw; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translateX(-50%) translateY(10px); }
.card canvas { width: min(220px, 56vw); height: auto; display: block; }
.card .tip { font: 800 .95rem var(--body); color: var(--muted); }
@media (max-width: 400px) { .level { font-size: .9rem; padding: 6px 9px 4px; } .step { width: 36px; height: 36px; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Laser Bounce. Tap a mirror to turn it. Get the laser dot to every sleeping cat."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle">
    <button class="round step" id="prevBtn" type="button" aria-label="Previous level"><svg viewBox="0 0 32 32"><path d="M20 7 L10 16 L20 25" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="level" id="levelLabel">Level 1</div>
    <button class="round step" id="nextBtn" type="button" aria-label="Next level"><svg viewBox="0 0 32 32"><path d="M12 7 L22 16 L12 25" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <button class="round" id="resetBtn" type="button" aria-label="Start this level again">
    <svg viewBox="0 0 32 32"><path d="M8 11 A10 10 0 1 1 7 19" fill="none" stroke="#2A2340" stroke-width="3.6" stroke-linecap="round"/><path d="M4 5 L8 12 L15 9" fill="none" stroke="#2A2340" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <canvas id="cardPic" width="440" height="300" aria-hidden="true"></canvas>
    <h2 id="cardTitle">Laser Bounce</h2>
    <p id="cardNote">Turn the mirrors so the laser dot reaches every sleeping cat.</p>
    <p class="tip" id="cardTip">Tap a mirror to turn it.</p>
    <button class="big" id="goBtn" type="button">Play</button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="game.js"></script>
</body>
</html>
