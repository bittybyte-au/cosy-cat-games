<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hide and Seek</title>
<meta name="theme-color" content="#DDF3FF">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Toddler game: the scene (canvas) fills the screen; a row of picture cards along the bottom shows what to find.
   Found things get a big tick. No words needed. Single bright look by design. */
body { background: #DDF3FF; }
.middle { flex: 1; }
.list {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--cream); border-top: 4px solid var(--ink);
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; justify-content: center; align-items: center;
}
.find {
  position: relative; width: 84px; height: 84px; border: 4px solid var(--ink); border-radius: 22px; background: #fff; box-shadow: 0 4px 0 var(--ink), var(--soft);
  display: grid; place-items: center; flex: none;
}
.find img { width: 70px; height: 70px; pointer-events: none; }
.find.got { background: #DDF6CF; animation: bump .5s ease; }
.find.got img { opacity: .55; }
.find .tick {
  position: absolute; right: -12px; top: -12px; width: 40px; height: 40px; border-radius: 50%; background: #3FC46A; border: 3.5px solid var(--ink);
  display: none; place-items: center; animation: present .4s cubic-bezier(.3, 1.6, .5, 1);
}
.find.got .tick { display: grid; }
.find .tick svg { width: 26px; height: 26px; }
.find.hint { animation: wig .6s ease 2; }
@keyframes wig { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.scenes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.scene {
  position: relative; width: 132px; height: 96px; border: 4px solid var(--ink); border-radius: 20px; padding: 0; overflow: hidden; cursor: pointer;
  box-shadow: 0 4px 0 var(--ink), var(--soft); background: #fff;
}
.scene img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
.scene.same { outline: 5px solid var(--sun); outline-offset: 2px; }
.scene .again { position: absolute; right: 4px; bottom: 4px; width: 38px; height: 38px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); display: grid; place-items: center; }
.scene .again svg { width: 24px; height: 24px; }
.scene:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
@media (max-width: 480px) {
  .list { gap: 8px; }
  .find { width: 70px; height: 70px; border-radius: 18px; }
  .find img { width: 58px; height: 58px; }
  .scene { width: 110px; height: 80px; }
}
@media (prefers-reduced-motion: reduce) { .find.hint { animation: none; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="A picture with things hidden in it. Find the things shown at the bottom and tap them."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle"></div>
  <button class="round" id="sceneBtn" type="button" aria-label="Pick a different picture">
    <svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="19" rx="4" fill="#9EDCFF" stroke="#2A2340" stroke-width="3"/><path d="M4 21 L11 15 L17 20 L21 17 L28 22" fill="#7BD389" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/><circle cx="21" cy="12.5" r="2.6" fill="#FFD23F" stroke="#2A2340" stroke-width="2"/></svg>
  </button>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="list" id="list" aria-label="Things to find"></div>

<div class="card-wrap" id="pickWrap" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h2 id="pickTitle">You found them all!</h2>
    <div class="scenes" id="scenes"></div>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="game.js"></script>
</body>
</html>
