<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitten Parade</title>
<meta name="theme-color" content="#BFE6FF">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* A walk-them-home puzzle for 10+: a parade of kittens hops out of a box and walks along by itself, turning at walls.
   Give a kitten a job (Stop, Dig, Tunnel, Steps, Brolly) and the others follow the way it opens up. Get enough of
   them into the cat house. A big drop makes a kitten dizzy and it has a nap where it lands (it's out of this go).
   The canvas is the garden; the jobs are along the bottom. */
body { background: #BFE6FF; }
#stage { touch-action: none; }
.middle { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
.pill2 { display: flex; align-items: center; gap: 5px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 11px 2px 7px; box-shadow: 0 3px 0 var(--ink); font: 800 1rem/1 var(--display); white-space: nowrap; }
.pill2 svg { width: 22px; height: 22px; flex: none; }
.pill2.bump { animation: bump .35s ease; }
.jobs { display: flex; gap: 7px; }
.ctl { display: flex; flex-direction: column; gap: 6px; justify-content: center; margin-left: 4px; }
.round.sm { width: 40px; height: 40px; }
.round.sm svg { width: 24px; height: 24px; }
.tools { align-items: flex-end; position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; gap: 7px; max-width: calc(100vw - 16px); }
.tool { position: relative; width: 64px; height: 64px; border: 4px solid var(--ink); border-radius: 18px; background: var(--cream); box-shadow: 0 4px 0 var(--ink), var(--soft); display: grid; place-items: center; cursor: pointer; padding: 0 0 8px; font: 800 .72rem/1 var(--body); color: var(--ink); }
.tool svg { width: 32px; height: 32px; pointer-events: none; }
.tool .nm { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; pointer-events: none; }
.tool .ct { position: absolute; top: -10px; right: -9px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--sun); border: 3px solid var(--ink); font: 800 .85rem/18px var(--display); text-align: center; padding: 0 3px; pointer-events: none; }
.tool.sel { background: #FFE58A; transform: translateY(-4px); box-shadow: 0 8px 0 var(--ink), var(--soft); }
.tool.none { opacity: .45; }
.tool.none .ct { background: #E8E2F0; }
.say { position: fixed; left: 50%; z-index: 6; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: 90vw; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translateX(-50%) translateY(-8px); }
.card canvas { width: min(240px, 60vw); height: auto; display: block; }
.card .tip { font: 800 .95rem var(--body); color: var(--muted); }
.lvpick { display: flex; align-items: center; justify-content: center; gap: 10px; font: 800 1.1rem var(--display); }
.lvpick button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 3px 0 var(--ink); font: 800 1.3rem/1 var(--display); cursor: pointer; }
.lvpick button:disabled { opacity: .35; cursor: default; }
.stars { display: flex; gap: 6px; justify-content: center; }
.stars svg { width: 38px; height: 38px; }
@media (max-height: 520px) and (min-aspect-ratio: 4/3) { .tools { left: auto; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; align-items: center; } .jobs { flex-direction: column; gap: 9px; } .ctl { flex-direction: row; margin: 4px 0 0; } .tool { width: 58px; height: 54px; } .tool svg { width: 26px; height: 26px; } }
@media (max-width: 400px) { .jobs { gap: 5px; } .tool { width: 56px; height: 58px; border-radius: 15px; } .tool svg { width: 28px; height: 28px; } .tools { gap: 5px; } .pill2 { font-size: .9rem; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Kitten Parade. Give the kittens jobs so they can walk home to the cat house."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle">
    <div class="level" id="levelLabel">Level 1</div>
    <div class="pill2" id="homePill" aria-label="Kittens home"><svg viewBox="0 0 32 32"><path d="M4 15 L16 5 L28 15 Z" fill="#E9837A" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/><rect x="7" y="14" width="18" height="14" rx="2" fill="#F2C27B" stroke="#2A2340" stroke-width="2.6"/><path d="M12 28 V22 A4 4 0 0 1 20 22 V28 Z" fill="#4A3656" stroke="#2A2340" stroke-width="2.2"/></svg><b id="homeCount">0 / 0</b></div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="tools" id="toolbar"><div class="jobs" id="tools" aria-label="Kitten jobs"></div><div class="ctl">
  <button class="round sm" id="fastBtn" type="button" aria-label="Speed up" aria-pressed="false"></button>
  <button class="round sm" id="againBtn" type="button" aria-label="Start this level again"><svg viewBox="0 0 32 32"><path d="M24 11 A10 10 0 1 0 26 18" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><path d="M19 9 H25 V3" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div></div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <canvas id="cardPic" width="480" height="300" aria-hidden="true"></canvas>
    <div class="stars" id="cardStars" hidden></div>
    <h2 id="cardTitle">Kitten Parade</h2>
    <p id="cardNote"></p>
    <p class="tip" id="cardTip"></p>
    <div class="lvpick" id="lvPick"><button type="button" id="lvPrev" aria-label="Previous level">‹</button><span id="lvName">Level 1</span><button type="button" id="lvNext" aria-label="Next level">›</button></div>
    <button class="big" id="goBtn" type="button">Let’s go!</button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="../../shared/scene.js"></script>
<script src="../../shared/things.js"></script>
<script src="game.js"></script>
</body>
</html>
