<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitty Pop</title>
<meta name="theme-color" content="#FFE6F0">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: a soft pink room; slim top bar with the level's goals; the board (canvas) fills the rest. Single bright look by design. */
:root {
  --wall: #FFE6F0;
  --wall2: #FFD6E6;
  --ink: #2A2340;
  --cream: #FFF8EC;
  --sun: #FFC93C;
  --grass: #7BD389;
  --sea: #3FA7F5;
  --muted: #6E6080;
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--ink); font-family: var(--body); font-size: 17px; overflow: hidden; overscroll-behavior: none;
  background: var(--wall) radial-gradient(circle at 20px 20px, var(--wall2) 6px, transparent 7px) 0 0 / 56px 56px;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
canvas#stage { position: fixed; inset: 0; touch-action: none; display: block; }
button { font-family: var(--body); color: var(--ink); -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }

.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 7;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.round {
  width: 56px; height: 56px; flex: none; border-radius: 50%; border: 3px solid var(--ink);
  background: var(--cream); box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0;
  text-decoration: none; color: var(--ink);
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.round svg { width: 30px; height: 30px; }

.middle { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.level { font: 800 1rem/1 var(--display); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px 2px; }
.goals { display: flex; gap: 8px; justify-content: center; flex-wrap: nowrap; }
.goal {
  display: flex; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--ink); border-radius: 999px;
  padding: 2px 10px 2px 3px; box-shadow: 0 3px 0 var(--ink); font: 800 1.3rem/1 var(--display); min-width: 74px;
  transition: background .2s ease;
}
.goal img { width: 40px; height: 40px; display: block; }
.goal b { min-width: 1.4em; text-align: center; font-weight: 800; }
.goal.bump { animation: bump .25s ease; }
.goal.done { background: var(--grass); }
.goal .tick { display: none; width: 22px; height: 22px; }
.goal.done .tick { display: block; }
.goal.done b { display: none; }
@keyframes bump { 50% { transform: scale(1.18); } }

.say {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 6; transform: translateX(-50%);
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 10px 22px; box-shadow: 0 4px 0 var(--ink);
  font: 800 clamp(1.1rem, 4.4vw, 1.4rem)/1.15 var(--body); text-align: center; white-space: nowrap; pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
}
.say.hide { opacity: 0; transform: translateX(-50%) translateY(16px); }

.win {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(42, 35, 64, .35);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card {
  width: min(420px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 30px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  animation: present .55s cubic-bezier(.3, 1.6, .5, 1);
}
.card h2 { margin: 0; font: 800 clamp(1.8rem, 7vw, 2.4rem)/1 var(--display); }
.card p { margin: 0; font: 800 1.15rem var(--body); color: var(--muted); }
.card .faces { display: flex; gap: 4px; justify-content: center; }
.card .faces img { width: 52px; height: 52px; animation: hop .6s ease-in-out infinite alternate; }
.card .faces img:nth-child(2) { animation-delay: .1s; } .card .faces img:nth-child(3) { animation-delay: .2s; }
.card .faces img:nth-child(4) { animation-delay: .3s; } .card .faces img:nth-child(5) { animation-delay: .4s; } .card .faces img:nth-child(6) { animation-delay: .5s; }
.big {
  min-height: 64px; padding: 0 30px; border-radius: 999px; border: 3px solid var(--ink); background: var(--grass); box-shadow: 0 5px 0 var(--ink);
  font: 800 1.45rem var(--display); cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.big svg { width: 26px; height: 26px; }
@keyframes present { from { transform: scale(.5) rotate(-8deg); opacity: 0; } }
@keyframes hop { to { transform: translateY(-8px); } }

@media (max-width: 380px) {
  .round { width: 48px; height: 48px; }
  .goal { min-width: 64px; padding-right: 8px; font-size: 1.15rem; }
  .goal img { width: 34px; height: 34px; }
  .goals { gap: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .card .faces img, .goal.bump { animation: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Board of cat faces. Swap two neighbouring cats to line up three the same."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><path d="M5 15 L16 5 L27 15 M9 13 V27 H23 V13" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="13.5" y="19" width="5" height="8" fill="#2A2340"/></svg>
  </a>
  <div class="middle">
    <div class="level" id="levelLabel">Level 1</div>
    <div class="goals" id="goals" aria-live="polite"></div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="faces" id="winFaces"></div>
    <h2 id="winTitle">Hooray!</h2>
    <p id="winNote">Level 1 done</p>
    <button class="big" id="nextBtn" type="button"><span>Next level</span><svg viewBox="0 0 32 32"><path d="M12 6 L22 16 L12 26" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<!-- Special cats (zoomy, big yawn, rainbow) live in their own add-on file.
     To switch them off, set ENABLED = false at the top of specials.js, or delete the line below.
     The game plays fine without it. -->
<script src="specials.js"></script>
<script src="game.js"></script>
</body>
</html>
