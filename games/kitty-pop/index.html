<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitty Match</title>
<meta name="theme-color" content="#FFE6F0">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Layout: a soft pink room; top bar, then a goal panel that stays on screen (beside the board on wide screens); the board (canvas) fills the rest. Single bright look by design. */
:root { --wall: #FFE6F0; --wall2: #FFD6E6; }
.topbar { flex-wrap: wrap; }
/* on wide screens the board starts beside the corner buttons, under the top bar's empty middle: let taps through to it */
.topbar, .topbar .middle { pointer-events: none; }
.topbar a, .topbar button, .topbar .level, .topbar .goals { pointer-events: auto; }
body { background: var(--wall) radial-gradient(circle at 20px 20px, var(--wall2) 6px, transparent 7px) 0 0 / 56px 56px; }
.middle { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.level { font-size: 1rem; padding: 4px 12px 2px; }
.goalpanel {
  flex-basis: 100%; min-width: 0; margin: 6px 0 0; background: var(--cream); border: 3px solid var(--ink); border-radius: 22px;
  box-shadow: 0 4px 0 var(--ink); padding: 6px 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.goalpanel h2 { margin: 0; font: 800 1.05rem/1.1 var(--display); color: var(--muted); }
.goals { display: flex; gap: 8px; justify-content: center; width: 100%; max-width: 560px; min-width: 0; }
.goal {
  position: relative; flex: 1 1 0; max-width: 170px; min-width: 0; display: flex; align-items: center; gap: 6px; background: #fff;
  border: 3px solid var(--ink); border-radius: 18px; padding: 4px 8px 4px 4px; transition: background .2s ease;
}
.goal img { width: 44px; height: 44px; display: block; flex: none; }
.goal .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.goal .count { display: flex; align-items: baseline; gap: 2px; font: 800 1.35rem/1 var(--display); white-space: nowrap; }
.goal .count small { font: 800 .95rem/1 var(--display); color: var(--muted); }
.goal .bar { height: 10px; border-radius: 99px; border: 2px solid var(--ink); background: #F1E9F7; overflow: hidden; }
.goal .bar i { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 99px; transition: width .25s ease; }
.goal.bump { animation: bump .25s ease; }
.goal.done { background: var(--grass); }
.goal.done .bar i { background: #fff; }
.goal .tick { display: none; position: absolute; left: -6px; top: -8px; width: 26px; height: 26px; padding: 3px; background: #fff; border: 2.5px solid var(--ink); border-radius: 50%; }
.goal.done .tick { display: block; }
.say {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 6; transform: translateX(-50%);
  max-width: none; white-space: nowrap; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
}
.say.hide { opacity: 0; transform: translateX(-50%) translateY(16px); }
@media (max-width: 380px) {
  .goal img { width: 32px; height: 32px; }
  .goal { gap: 3px; padding-right: 6px; }
  .goal .count { font-size: 1.1rem; }
  .goal .count small { font-size: .78rem; }
  .goals { gap: 6px; }
}
.sidelevel { display: none; }
/* tablets and computers: the level and goals sit in a tall card beside the board (game.js places it).
   Home and sound stay in the top corners. */
@media (min-width: 700px) and (min-aspect-ratio: 1/1) {
  .middle { display: none; }
  #soundBtn { margin-left: auto; }
  .goalpanel {
    position: fixed; left: 16px; top: 90px; width: 220px; max-width: none; flex-basis: auto; margin: 0;
    padding: 16px 14px 16px; gap: 12px; border-width: 4px; border-radius: 28px; box-shadow: 0 6px 0 var(--ink);
  }
  .sidelevel { display: block; font: 800 1.6rem/1 var(--display); }
  .goalpanel h2 { font-size: 1.1rem; }
  .goals { flex-direction: column; gap: 10px; }
  .goal { flex: none; max-width: none; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 20px; }
  .goal img { width: 54px; height: 54px; }
  .goal .count { font-size: 1.7rem; }
  .goal .count small { font-size: 1.05rem; }
  .goal .bar { height: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .goal.bump { animation: none; }
}
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Board of cat faces. Swap two neighbouring cats to line up three the same."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><path d="M5 15 L16 5 L27 15 M9 13 V27 H23 V13" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="13.5" y="19" width="5" height="8" fill="#2A2340"/></svg>
  </a>
  <div class="middle">
    <div class="level" id="levelLabel">Level 1</div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
  <section class="goalpanel" id="goalPanel" aria-labelledby="goalTitle">
    <div class="sidelevel" id="sideLevel">Level 1</div>
    <h2 id="goalTitle">Match these cats</h2>
    <div class="goals" id="goals" aria-live="polite"></div>
  </section>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="faces" id="winFaces"></div>
    <h2 id="winTitle">Hooray!</h2>
    <p id="winNote">Level 1 done</p>
    <button class="big" id="nextBtn" type="button"><span>Next level</span><svg viewBox="0 0 32 32"><path d="M12 6 L22 16 L12 26" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/cat.js"></script>
<!-- Special cats (zoomy, big yawn, rainbow) live in their own add-on file.
     To switch them off, set ENABLED = false at the top of specials.js, or delete the line below.
     The game plays fine without it. -->
<script src="specials.js"></script>
<script src="game.js"></script>
</body>
</html>
