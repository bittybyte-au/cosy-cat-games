<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Yarn Sort</title>
<meta name="theme-color" content="#F3EAFF">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: a soft lilac knitting room; slim top bar (home, level, sound); tubes of yarn on the canvas;
   a bottom bar with Undo, Restart and Extra tube. Single bright look by design. */
:root {
  --wall: #F3EAFF;
  --wall2: #E8DAFB;
  --ink: #2A2340;
  --cream: #FFF8EC;
  --sun: #FFC93C;
  --grass: #7BD389;
  --sea: #3FA7F5;
  --muted: #6E6080;
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--ink); font-family: var(--body); font-size: 17px; overflow: hidden; overscroll-behavior: none;
  background: var(--wall) repeating-linear-gradient(45deg, transparent 0 18px, var(--wall2) 18px 22px);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
canvas#stage { position: fixed; inset: 0; touch-action: none; display: block; }
button { font-family: var(--body); color: var(--ink); -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }

.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 7;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.round {
  width: 56px; height: 56px; flex: none; border-radius: 50%; border: 3px solid var(--ink);
  background: var(--cream); box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0;
  text-decoration: none; color: var(--ink);
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.round svg { width: 30px; height: 30px; }
.middle { flex: 1; display: flex; justify-content: center; min-width: 0; }
.level { font: 800 1.35rem/1 var(--display); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 8px 18px 6px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }

.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; justify-content: center; gap: 12px;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.tool {
  min-height: 60px; min-width: 96px; padding: 4px 14px; border-radius: 20px; border: 3px solid var(--ink); background: var(--cream);
  box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 800 .9rem var(--body);
}
.tool svg { width: 28px; height: 28px; }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tool:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 0 4px 0 var(--ink); }
.tool.nudge { background: var(--sun); animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-5px) scale(1.06); } }

.say {
  position: fixed; left: 50%; top: 50%; z-index: 6; transform: translate(-50%, -50%);
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 10px 22px; box-shadow: 0 4px 0 var(--ink);
  font: 800 clamp(1.1rem, 4.4vw, 1.45rem)/1.15 var(--body); text-align: center; pointer-events: none; max-width: calc(100% - 32px);
  transition: opacity .3s ease, transform .3s ease;
}
.say.hide { opacity: 0; transform: translate(-50%, -50%) scale(.9); }

.card-wrap {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(42, 35, 64, .35);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card {
  width: min(420px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 30px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  animation: present .55s cubic-bezier(.3, 1.6, .5, 1);
}
.card h2 { margin: 0; font: 800 clamp(1.8rem, 7vw, 2.4rem)/1 var(--display); }
.card p { margin: 0; font: 800 1.15rem var(--body); color: var(--muted); }
.card .faces { display: flex; gap: 4px; justify-content: center; }
.card .faces img { width: 56px; height: 56px; animation: hop .6s ease-in-out infinite alternate; }
.card .faces img:nth-child(2) { animation-delay: .12s; } .card .faces img:nth-child(3) { animation-delay: .24s; }
.card .faces img:nth-child(4) { animation-delay: .36s; }
.big {
  min-height: 64px; padding: 0 30px; border-radius: 999px; border: 3px solid var(--ink); background: var(--grass); box-shadow: 0 5px 0 var(--ink);
  font: 800 1.45rem var(--display); cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.big svg { width: 26px; height: 26px; }
@keyframes present { from { transform: scale(.5) rotate(-8deg); opacity: 0; } }
@keyframes hop { to { transform: translateY(-8px); } }

@media (max-width: 380px) {
  .round { width: 48px; height: 48px; }
  .tool { min-width: 84px; padding: 4px 8px; font-size: .82rem; }
  .bottombar { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .card .faces img, .tool.nudge { animation: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Tubes of yarn balls. Tap a tube, then another, to move the yarn on top. Sort each tube into one colour."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><path d="M5 15 L16 5 L27 15 M9 13 V27 H23 V13" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="13.5" y="19" width="5" height="8" fill="#2A2340"/></svg>
  </a>
  <div class="middle"><div class="level" id="levelLabel">Level 1</div></div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="bottombar" id="bottombar">
  <button class="tool" id="undoBtn" type="button" disabled>
    <svg viewBox="0 0 32 32"><path d="M11 9 L5 15 L11 21" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15 H19 A7 7 0 0 1 19 29 H14" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/></svg>
    Undo
  </button>
  <button class="tool" id="restartBtn" type="button">
    <svg viewBox="0 0 32 32"><path d="M26 16 A10 10 0 1 1 22.5 8.4" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><path d="M23 3 V9 H17" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Restart
  </button>
  <button class="tool" id="extraBtn" type="button">
    <svg viewBox="0 0 32 32"><rect x="9" y="5" width="12" height="23" rx="6" fill="#fff" stroke="#2A2340" stroke-width="3"/><circle cx="24" cy="10" r="6.5" fill="#7BD389" stroke="#2A2340" stroke-width="2.5"/><path d="M24 7 V13 M21 10 H27" stroke="#2A2340" stroke-width="2.5" stroke-linecap="round"/></svg>
    Extra tube
  </button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="faces" id="cardFaces"></div>
    <h2 id="cardTitle">All sorted!</h2>
    <p id="cardNote">Level 1 done</p>
    <button class="big" id="nextBtn" type="button"><span>Next level</span><svg viewBox="0 0 32 32"><path d="M12 6 L22 16 L12 26" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="game.js"></script>
</body>
</html>
