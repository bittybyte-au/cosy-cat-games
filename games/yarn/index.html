<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Yarn Sort</title>
<meta name="theme-color" content="#F3EAFF">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Layout: a soft lilac knitting room; slim top bar (home, level, sound); tubes of yarn on the canvas;
   a bottom bar with Undo, Restart and Extra tube. Single bright look by design. */
:root { --wall: #F3EAFF; --wall2: #E8DAFB; }
body { background: var(--wall) repeating-linear-gradient(45deg, transparent 0 18px, var(--wall2) 18px 22px); }
.middle { flex: 1; display: flex; justify-content: center; min-width: 0; }
.level { font-size: 1.35rem; padding: 8px 18px 6px; box-shadow: 0 3px 0 var(--ink); }
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; justify-content: center; gap: 12px;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.tool {
  min-height: 60px; min-width: 96px; padding: 4px 14px; border-radius: 20px; border: 3px solid var(--ink); background: var(--cream);
  box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 800 .9rem var(--body);
}
.tool svg { width: 28px; height: 28px; }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tool:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 0 4px 0 var(--ink); }
.tool.nudge { background: var(--sun); animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-5px) scale(1.06); } }
.say { position: fixed; left: 50%; top: 50%; z-index: 6; transform: translate(-50%, -50%); pointer-events: none; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translate(-50%, -50%) scale(.9); }
@media (max-width: 380px) {
  .tool { min-width: 84px; padding: 4px 8px; font-size: .82rem; }
  .bottombar { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .tool.nudge { animation: none; }
}
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Tubes of yarn balls. Tap a tube, then another, to move the yarn on top. Sort each tube into one colour."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle"><div class="level" id="levelLabel">Level 1</div></div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="bottombar" id="bottombar">
  <button class="tool" id="undoBtn" type="button" disabled>
    <svg viewBox="0 0 32 32"><path d="M11 9 L5 15 L11 21" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15 H19 A7 7 0 0 1 19 29 H14" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/></svg>
    Undo
  </button>
  <button class="tool" id="restartBtn" type="button">
    <svg viewBox="0 0 32 32"><path d="M26 16 A10 10 0 1 1 22.5 8.4" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><path d="M23 3 V9 H17" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Restart
  </button>
  <button class="tool" id="extraBtn" type="button">
    <svg viewBox="0 0 32 32"><rect x="9" y="5" width="12" height="23" rx="6" fill="#fff" stroke="#2A2340" stroke-width="3"/><circle cx="24" cy="10" r="6.5" fill="#7BD389" stroke="#2A2340" stroke-width="2.5"/><path d="M24 7 V13 M21 10 H27" stroke="#2A2340" stroke-width="2.5" stroke-linecap="round"/></svg>
    Extra tube
  </button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="faces" id="cardFaces"></div>
    <h2 id="cardTitle">All sorted!</h2>
    <p id="cardNote">Level 1 done</p>
    <button class="big" id="nextBtn" type="button"><span>Next level</span><svg viewBox="0 0 32 32"><path d="M12 6 L22 16 L12 26" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/cat.js"></script>
<script src="game.js"></script>
</body>
</html>
