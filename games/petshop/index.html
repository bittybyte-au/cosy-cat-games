<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pet Shop</title>
<meta name="theme-color" content="#FFF1E2">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Toddler game: the whole screen is the shop. Things lie on the floor; put each one on the shelf with its picture.
   No words needed, nothing to lose. When the shelves are full, a big round button starts a new round. */
body { background: #FFF1E2; }
.middle { flex: 1; }
.again-wrap { position: fixed; left: 0; right: 0; bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px)); z-index: 8; display: flex; justify-content: center; pointer-events: none; }
.again-wrap[hidden] { display: none; }
.again-wrap .big { pointer-events: auto; width: 104px; height: 104px; min-height: 0; padding: 0; justify-content: center; border-radius: 50%; animation: present .55s cubic-bezier(.3, 1.6, .5, 1), bump 1.6s 1s ease-in-out infinite; }
.again-wrap .big svg { width: 58px; height: 58px; }
.again-wrap .big:focus-visible { outline: 4px solid #7CC4FF; outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { .again-wrap .big { animation: none; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="A pet shop. Put each thing from the floor on the shelf with the same picture."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle"></div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="again-wrap" id="again" hidden>
  <button class="big again" id="againBtn" type="button" aria-label="Play again">
    <svg viewBox="0 0 32 32"><path d="M25 16A9 9 0 1 1 20.5 8.2" fill="none" stroke="#2A2340" stroke-width="3.6" stroke-linecap="round"/><path d="M17.5 3.5L23.5 8.5L17 12.5Z" fill="#2A2340" stroke="#2A2340" stroke-width="2.4" stroke-linejoin="round"/></svg>
  </button>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/scene.js"></script>
<script src="../../shared/things.js"></script>
<script src="game.js"></script>
</body>
</html>
