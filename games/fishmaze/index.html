<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fish Maze</title>
<meta name="theme-color" content="#CDEBC0">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* A maze chase for 5-10: your cat munches the fish round a garden hedge maze while playful puppies wander about.
   A puppy that catches the cat gives it a lick (a heart is used up and the cat pops back to the start). Catnip
   makes the puppies sleepy for a while: boop one and it trots home for a nap. Eat every fish to finish.
   The canvas is the garden; the arrows at the bottom (or a swipe, or the arrow keys) steer. Single bright look. */
body { background: #CDEBC0; }
#stage { touch-action: none; }
.middle { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
.pill2 { display: flex; align-items: center; gap: 5px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 11px 2px 7px; box-shadow: 0 3px 0 var(--ink); font: 800 1rem/1 var(--display); white-space: nowrap; }
.pill2 svg { width: 22px; height: 22px; flex: none; }
.pill2.bump { animation: bump .35s ease; }
.hearts { display: flex; gap: 2px; }
.hearts svg { width: 22px; height: 22px; }
.hearts svg.gone { opacity: .25; }
.pad { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); z-index: 6; display: grid; grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(2, 58px); gap: 6px; }
.pad button { border: 4px solid var(--ink); border-radius: 18px; background: var(--cream); box-shadow: 0 4px 0 var(--ink), var(--soft); display: grid; place-items: center; cursor: pointer; touch-action: none; padding: 0; }
.pad button:active, .pad button.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); background: var(--sun); }
.pad svg { width: 30px; height: 30px; pointer-events: none; }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.say { position: fixed; left: 50%; z-index: 6; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: 90vw; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translateX(-50%) translateY(-8px); }
.card canvas { width: min(220px, 56vw); height: auto; display: block; }
.card .tip { font: 800 .95rem var(--body); color: var(--muted); }
@media (min-width: 900px) and (min-aspect-ratio: 4/3) { .pad { left: auto; right: max(24px, env(safe-area-inset-right, 0px)); transform: none; bottom: 40px; } }
@media (max-width: 400px) { .pad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 52px); } .pill2 { font-size: .9rem; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Fish Maze. Steer your cat round the maze to eat every fish. Catnip makes the puppies sleepy."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle">
    <div class="level" id="levelLabel">Level 1</div>
    <div class="pill2" id="fishPill" aria-label="Fish left"><svg viewBox="0 0 32 32"><path d="M4 16 Q12 7 21 12 L28 7 V25 L21 20 Q12 25 4 16 Z" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/><circle cx="11" cy="15" r="1.8" fill="#2A2340"/></svg><b id="fishLeft">0</b></div>
    <div class="hearts" id="hearts" aria-label="Hearts"></div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="pad" id="pad" aria-label="Steer">
  <button class="up" type="button" data-d="up" aria-label="Up"><svg viewBox="0 0 32 32"><path d="M7 20 L16 10 L25 20" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="left" type="button" data-d="left" aria-label="Left"><svg viewBox="0 0 32 32"><path d="M20 7 L10 16 L20 25" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="down" type="button" data-d="down" aria-label="Down"><svg viewBox="0 0 32 32"><path d="M7 12 L16 22 L25 12" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="right" type="button" data-d="right" aria-label="Right"><svg viewBox="0 0 32 32"><path d="M12 7 L22 16 L12 25" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <canvas id="cardPic" width="440" height="300" aria-hidden="true"></canvas>
    <h2 id="cardTitle">Fish Maze</h2>
    <p id="cardNote">Munch every fish in the maze! Watch out for the playful puppies.</p>
    <p class="tip" id="cardTip">Steer with the arrows (or swipe). Eat the catnip and the puppies get sleepy: boop them home for a nap!</p>
    <button class="big" id="goBtn" type="button">Let’s go!</button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="../../shared/scene.js"></script>
<script src="../../shared/things.js"></script>
<script src="game.js"></script>
</body>
</html>
