<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sneaky Cat</title>
<meta name="theme-color" content="#2B2550">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* A stealth game for older kids, seen from above: your cat sneaks across the room at night to the midnight snack,
   past sleeping dogs. Press and hold where you want to go (or arrow keys); the cat walks there round the furniture.
   Dogs stir, then look; their glow shows what they can see, and furniture blocks it, so hide behind it. Seen, and
   your cat scurries back to the last safe spot. One canvas for the room (turned on an upright phone); the top bar
   holds the level picker. Single night look by design. */
body { background: #2B2550; }
#stage { touch-action: none; }
.middle { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
.step { width: 40px; height: 40px; }
.step:disabled { opacity: .35; cursor: default; }
.step svg { width: 22px; height: 22px; }
.say { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 78px); z-index: 6; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: 90vw; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translateX(-50%) translateY(-10px); }
.card canvas { width: min(240px, 60vw); height: auto; display: block; }
.card .tip { font: 800 .95rem var(--body); color: var(--muted); }
.card .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
/* a phone on its side: the picture beside the words, so the whole card fits */
@media (max-height: 520px) {
  .say { top: auto; bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
  .say.hide { transform: translateX(-50%) translateY(10px); }
}
@media (max-height: 520px) and (min-width: 560px) {
  .card-wrap .card { width: min(660px, 100%); display: grid; grid-template-columns: 210px 1fr; column-gap: 20px; row-gap: 8px; padding: 16px 20px; }
  .card canvas { grid-row: 1 / span 4; width: 210px; align-self: center; }
  .card h2 { font-size: 1.8rem; }
  .card p { font-size: 1rem; }
}
@media (max-width: 400px) { .level { font-size: .9rem; padding: 6px 9px 4px; } .step { width: 36px; height: 36px; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Sneaky Cat. Press and hold where you want your cat to go. Stay out of a looking dog's glow: hide behind the furniture."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle">
    <button class="round step" id="prevBtn" type="button" aria-label="Previous level"><svg viewBox="0 0 32 32"><path d="M20 7 L10 16 L20 25" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="level" id="levelLabel">Level 1</div>
    <button class="round step" id="nextBtn" type="button" aria-label="Next level"><svg viewBox="0 0 32 32"><path d="M12 7 L22 16 L12 25" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <button class="round" id="resetBtn" type="button" aria-label="Start this level again">
    <svg viewBox="0 0 32 32"><path d="M8 11 A10 10 0 1 1 7 19" fill="none" stroke="#2A2340" stroke-width="3.6" stroke-linecap="round"/><path d="M4 5 L8 12 L15 9" fill="none" stroke="#2A2340" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <canvas id="cardPic" width="440" height="300" aria-hidden="true"></canvas>
    <h2 id="cardTitle">Sneaky Cat</h2>
    <p id="cardNote">Sneak past the sleeping dogs to your midnight snack.</p>
    <p class="tip" id="cardTip">Press and hold where you want to go. When a dog’s ear goes up, hide behind the furniture!</p>
    <div class="btns">
      <button class="big" id="againBtn" type="button" hidden>Play again</button>
      <button class="big" id="goBtn" type="button">Sneak!</button>
    </div>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/scene.js"></script>
<script src="../../shared/things.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="game.js"></script>
</body>
</html>
