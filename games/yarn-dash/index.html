<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Yarn Dash</title>
<meta name="theme-color" content="#E8F4E0">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Layout: the room floor (canvas) fills the screen under the top bar. The top bar shows the level and a basket
   that fills up as you collect yarn. Cards between levels introduce each new thing to avoid. Single bright look by design. */
body { background: #D9C3A5; }
.middle { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; }
.basket {
  display: flex; align-items: center; gap: 8px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px;
  padding: 5px 12px 5px 8px; box-shadow: 0 3px 0 var(--ink); min-width: 0; flex: 0 1 300px;
}
.basket svg { width: 30px; height: 30px; flex: none; }
.basket .bar { flex: 1; height: 14px; border-radius: 99px; border: 2.5px solid var(--ink); background: #EEE6F6; overflow: hidden; min-width: 50px; }
.basket .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #FF8FAB, #FFD23F); transition: width .25s ease; }
.basket b { font: 800 1rem/1 var(--display); white-space: nowrap; }
.basket.bump { animation: bump .4s ease; }
.basket.ouch { animation: ouch .4s ease; }
@keyframes ouch { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.say { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 6; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: 90vw; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translateX(-50%) translateY(10px); }
.card canvas { width: min(220px, 56vw); height: auto; display: block; }
.card .tip { font: 800 .95rem var(--body); color: var(--muted); }
@media (max-width: 420px) { .basket b { font-size: .9rem; } .level { font-size: .9rem; padding: 6px 9px 4px; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="The yarn dash room. Press and hold, or use the arrow keys, to run your cat around and collect yarn balls."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle">
    <div class="level" id="levelLabel">Level 1</div>
    <div class="basket" id="basket" aria-live="polite">
      <svg viewBox="0 0 32 32"><path d="M5 13 H27 L24 27 H8 Z" fill="#E6B98A" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/><path d="M9 13 Q16 2 23 13" fill="none" stroke="#2A2340" stroke-width="2.6"/><circle cx="13" cy="12" r="5" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.2"/><circle cx="20" cy="12" r="4.5" fill="#FFD23F" stroke="#2A2340" stroke-width="2.2"/></svg>
      <div class="bar"><i id="barFill"></i></div>
      <b id="count">0/12</b>
    </div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="cardWrap">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <canvas id="cardPic" width="440" height="300" aria-hidden="true"></canvas>
    <h2 id="cardTitle">Yarn Dash</h2>
    <p id="cardNote">Run around and collect the yarn before it rolls away! Gold yarn is worth 3.</p>
    <p class="tip" id="cardTip">Press and hold where you want to go, or use the arrow keys.</p>
    <button class="big" id="goBtn" type="button">Go!</button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="game.js"></script>
</body>
</html>
