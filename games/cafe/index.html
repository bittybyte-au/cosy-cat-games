<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cat Café</title>
<meta name="theme-color" content="#FFE9D6">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Layout: the café (canvas) fills the screen between the top bar and the ingredient shelf along the bottom.
   The shelf holds the ingredients, the tray (up to 3 things) and the bell that sends the tray to the chef.
   Single bright look by design. */
body { background: #F6D9BF; }
.middle { flex: 1; display: flex; justify-content: center; gap: 8px; min-width: 0; }
.pill { font: 800 1.15rem/1 var(--display); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 7px 14px 5px; box-shadow: 0 3px 0 var(--ink), var(--soft); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.pill svg { width: 22px; height: 22px; }
.pill.bump { animation: bump .45s ease; }
.pill.ouch { animation: ouch .45s ease; }
@keyframes ouch { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); background: #FFD0D0; } 75% { transform: translateX(6px); background: #FFD0D0; } }

.shelf {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--cream); border-top: 4px solid var(--ink);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
}
.ings { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 440px; }
.ing {
  width: 64px; height: 64px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; cursor: pointer; padding: 2px;
  display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink), var(--soft);
}
.ing img { width: 54px; height: 54px; pointer-events: none; }
.ing:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
.trayrow { display: flex; align-items: center; gap: 10px; }
.tray {
  display: flex; gap: 6px; padding: 6px 10px; border: 3px solid var(--ink); border-radius: 999px; background: #D9C2A7; box-shadow: inset 0 -5px 0 rgba(42, 35, 64, .15);
}
.slot { width: 56px; height: 56px; border-radius: 50%; border: 3px dashed rgba(42, 35, 64, .35); background: rgba(255, 255, 255, .45); display: grid; place-items: center; padding: 0; cursor: default; }
.slot.full { border: 3px solid var(--ink); background: #fff; cursor: pointer; animation: present .35s cubic-bezier(.3, 1.6, .5, 1); }
.slot img { width: 46px; height: 46px; pointer-events: none; }
.bell {
  width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); background: var(--sun); cursor: pointer; box-shadow: 0 4px 0 var(--ink), var(--soft);
  display: grid; place-items: center; padding: 0;
}
.bell svg { width: 50px; height: 50px; }
.bell:disabled { background: #EEE8F3; box-shadow: none; cursor: default; }
.bell:disabled svg { opacity: .4; }
.bell:not(:disabled) { animation: hop .7s ease-in-out infinite alternate; }
.bell:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink), var(--soft); }

.say { position: fixed; left: 50%; bottom: calc(var(--bar-h, 180px) + 14px); z-index: 6; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: 90vw; transition: opacity .3s ease, transform .3s ease; }
.say.hide { opacity: 0; transform: translateX(-50%) translateY(10px); }

/* start screen: Fun or Challenge */
.modes { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.mode {
  border: 4px solid var(--ink); border-radius: 22px; padding: 12px 16px; cursor: pointer; text-align: left; box-shadow: 0 5px 0 var(--ink), var(--soft);
  display: flex; align-items: center; gap: 12px; font: 800 1rem var(--body); color: var(--ink);
}
.mode b { display: block; font: 800 1.5rem/1.05 var(--display); }
.mode span { color: var(--muted); }
.mode svg { flex: none; width: 54px; height: 54px; }
.mode.fun { background: #C7EBD2; }
.mode.chal { background: #FFD9A8; }
.mode:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
.days { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.day {
  width: 62px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; cursor: pointer; padding: 4px 2px; box-shadow: 0 3px 0 var(--ink), var(--soft);
  font: 800 1.05rem/1.1 var(--display); display: flex; flex-direction: column; align-items: center;
}
.day small { font: 800 .75rem var(--body); color: #E0A100; letter-spacing: 1px; min-height: 1em; }
.day.now { background: var(--sun); }
.day:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
.bigstars { display: flex; gap: 6px; justify-content: center; }
.bigstars svg { width: 58px; height: 58px; animation: present .5s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.bigstars svg:nth-child(2) { animation-delay: .15s; }
.bigstars svg:nth-child(3) { animation-delay: .3s; }
.card .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.card .big.plain { background: #fff; }

@media (max-width: 520px) {
  .ing { width: 54px; height: 54px; border-radius: 15px; }
  .ing img { width: 44px; height: 44px; }
  .ings { gap: 6px; max-width: 360px; }
  .slot { width: 48px; height: 48px; }
  .slot img { width: 40px; height: 40px; }
  .bell { width: 64px; height: 64px; }
  .bell svg { width: 42px; height: 42px; }
  .pill { font-size: 1rem; padding: 6px 10px 4px; }
}
@media (prefers-reduced-motion: reduce) { .bell:not(:disabled) { animation: none; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="The café. Cat customers wait at the counter with their orders. Drag a finished dish from the kitchen to the right cat."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <button class="round" id="menuBtn" type="button" aria-label="Back to the café menu" hidden>
    <svg viewBox="0 0 32 32"><path d="M20 6 L10 16 L20 26" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="middle">
    <div class="pill" id="starPill" aria-live="polite"><svg viewBox="0 0 32 32"><path d="M16 3 L19.8 11.6 L29 12.4 L22 18.6 L24.2 27.8 L16 22.8 L7.8 27.8 L10 18.6 L3 12.4 L12.2 11.6 Z" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/></svg><span id="stars">0</span></div>
    <div class="pill" id="leftPill" hidden><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="11" fill="#FFA94D" stroke="#2A2340" stroke-width="2.6"/><path d="M7 11 L8 3 L14 8 M25 11 L24 3 L18 8" fill="#FFA94D" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/></svg><span id="left">0</span></div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="shelf" id="shelf">
  <div class="ings" id="ings" aria-label="Ingredients"></div>
  <div class="trayrow">
    <div class="tray" id="tray" aria-label="Your tray"></div>
    <button class="bell" id="bell" type="button" aria-label="Send the tray to the chef" disabled>
      <svg viewBox="0 0 48 48"><path d="M8 36 H40" stroke="#2A2340" stroke-width="4" stroke-linecap="round"/><path d="M11 34 Q11 16 24 15 Q37 16 37 34 Z" fill="#FFF3B0" stroke="#2A2340" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="12" r="3.5" fill="#FFF3B0" stroke="#2A2340" stroke-width="3"/><path d="M17 22 Q18 19 21 18" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
</div>

<div class="say hide" id="say" aria-live="polite"></div>

<div class="card-wrap" id="startWrap">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <h2 id="startTitle">Cat Café</h2>
    <p>Pick the ingredients, ring the bell for the chef, then give each cat the dish they ordered.</p>
    <div class="modes">
      <button class="mode fun" id="funBtn" type="button">
        <svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="#7BD389" stroke="#2A2340" stroke-width="3.5"/><path d="M17 30 Q27 40 37 30" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="22" r="3" fill="#2A2340"/><circle cx="34" cy="22" r="3" fill="#2A2340"/></svg>
        <div><b>Fun</b><span>No rush. Take your time.</span></div>
      </button>
      <button class="mode chal" id="chalBtn" type="button">
        <svg viewBox="0 0 54 54"><circle cx="27" cy="29" r="20" fill="#fff" stroke="#2A2340" stroke-width="3.5"/><path d="M27 29 V17 M27 29 L35 34" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><rect x="22" y="3" width="10" height="6" rx="2" fill="#FF6B57" stroke="#2A2340" stroke-width="3"/></svg>
        <div><b>Challenge</b><span>Busy days. Cats won&rsquo;t wait forever!</span></div>
      </button>
    </div>
    <div class="days" id="days" hidden></div>
  </div>
</div>

<div class="card-wrap" id="endWrap" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <h2 id="endTitle">Day done!</h2>
    <div class="bigstars" id="bigStars"></div>
    <p id="endNote"></p>
    <div class="btns">
      <button class="big again" id="nextBtn" type="button">Next day</button>
      <button class="big plain" id="againBtn" type="button">Play again</button>
      <button class="big plain" id="endMenuBtn" type="button">Menu</button>
    </div>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/scene.js"></script>
<script src="game.js"></script>
</body>
</html>
