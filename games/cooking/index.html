<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cosy Kitchen</title>
<meta name="theme-color" content="#FFE3CC">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Layout: a full-screen kitchen counter (canvas) with a slim top bar and a fixed tool tray at the bottom. Single bright look by design. */
:root { --wall: #FFE3CC; --tray-h: 156px; }
body { background: var(--wall); }
/* Top bar */
.title { flex: 1; min-width: 0; text-align: center; font: 800 clamp(1.4rem, 5vw, 2rem)/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps { flex: 1; display: flex; justify-content: center; gap: 6px; min-width: 0; }
.step {
  display: flex; flex-direction: column; align-items: center; gap: 2px; font: 800 .72rem var(--body); color: var(--muted);
  min-width: 0;
}
.step i {
  width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); display: grid; place-items: center;
}
.step i svg { width: 24px; height: 24px; }
.step.now { color: var(--ink); }
.step.now i { background: var(--sun); transform: scale(1.12); }
.step.done i { background: var(--grass); }
.steps.many { gap: 4px; align-items: center; }
.steps.many .step:not(.now) i { width: 18px; height: 18px; border-width: 2.5px; }
.steps.many .step:not(.now) i svg, .steps.many .step:not(.now) span { display: none; }
/* Bottom tray */
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: auto;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 8px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  pointer-events: none;
}
.tray > * { pointer-events: auto; }
.tray.notools .tools { display: none; }
.say-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; }
.say { max-width: 100%; font-size: clamp(1.15rem, 4.6vw, 1.5rem); }
.say:empty { display: none; }
.undo { flex: none; }
.undo:disabled { opacity: .35; cursor: default; box-shadow: 0 2px 0 var(--ink), var(--soft); }
.next {
  min-height: 64px; padding: 0 26px; border-radius: 999px; border: 3px solid var(--ink); background: var(--grass);
  font: 800 1.4rem var(--display); box-shadow: 0 5px 0 var(--ink), var(--soft); cursor: pointer; display: flex; align-items: center; gap: 8px; flex: none;
  animation: next-bob 1.2s ease-in-out infinite;
}
.next:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), var(--soft); animation: none; }
.next svg { width: 26px; height: 26px; }
@keyframes next-bob { 50% { transform: translateY(-4px) scale(1.04); } }
.tools {
  display: flex; gap: 10px; justify-content: center; overflow-x: auto; padding: 10px 4px 10px; scrollbar-width: none;
}
.tools::-webkit-scrollbar { display: none; }
.tool {
  flex: none; width: 70px; height: 76px; border-radius: 20px; border: 3px solid var(--ink); background: var(--cream);
  box-shadow: 0 4px 0 var(--ink), var(--soft); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: 800 .78rem var(--body); padding: 4px 2px;
}
.tool svg { width: 40px; height: 40px; }
.tool[aria-pressed="true"] { background: var(--sun); transform: translateY(-4px); box-shadow: 0 8px 0 var(--ink), var(--soft); }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
/* Kawaii chef cat */
.cat {
  position: fixed; z-index: 8; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tray-h) - 30px + env(safe-area-inset-bottom, 0px));
  width: 150px; pointer-events: none; opacity: 0; visibility: hidden; transform: translateY(70%) rotate(8deg);
  transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), opacity .25s ease, visibility 0s linear .45s;
}
.cat.low { bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.cat.show { opacity: 1; visibility: visible; transform: translateY(0) rotate(0); transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), opacity .15s ease, visibility 0s; }
.cat svg { width: 150px; height: auto; display: block; }
.cat .bubble {
  position: absolute; right: 118px; top: -6px; background: #fff; border: 3px solid var(--ink); border-radius: 22px;
  padding: 8px 14px; font: 800 1.25rem/1.1 var(--display); white-space: nowrap; box-shadow: 0 4px 0 var(--ink), var(--soft);
}
.cat .bubble::after {
  content: ""; position: absolute; right: -14px; top: 22px; border: 8px solid transparent; border-left: 12px solid var(--ink);
}
/* Menu and finish screens */
.screen {
  position: fixed; inset: 0; z-index: 6; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: calc(84px + env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen .inner { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.screen h2 { margin: 0; font: 800 clamp(1.7rem, 6vw, 2.4rem)/1.05 var(--display); text-wrap: balance; }
.screen h3 { margin: 6px 0 0; font: 800 1.5rem/1 var(--display); }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 24px 16px; padding-top: 8px; }
.recipe {
  position: relative; border: 4px solid var(--ink); border-radius: 26px; background: #fff; padding: 12px 12px 16px; text-align: center;
  box-shadow: 0 6px 0 var(--ink), var(--soft); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font: 800 1.25rem var(--display); color: var(--ink);
}
.recipe:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink), var(--soft); }
.recipe svg { width: 100%; max-width: 180px; height: auto; }
.recipe.hero { background: #CFF0FF; }
.recipe small { font: 800 .95rem var(--body); color: var(--muted); }
.recipe .count {
  position: absolute; top: -14px; left: 12px; transform: rotate(-4deg); background: var(--sun); border: 3px solid var(--ink); border-radius: 999px;
  padding: 2px 12px; font: 800 .95rem var(--body); box-shadow: 0 3px 0 var(--ink), var(--soft);
}
.recipe .step-icons { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.recipe .step-icons i { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--cream); display: grid; place-items: center; }
.recipe .step-icons svg { width: 16px; height: 16px; max-width: none; }
.recipe.needs-pass > svg { opacity: .55; }
.recipe .soon svg { width: 14px; height: 14px; max-width: none; opacity: 1; }
.recipe.needs-pass small { color: var(--ink); }
.recipe.locked { background: rgba(255, 255, 255, .5); border-style: dashed; box-shadow: none; cursor: default; color: var(--muted); }
.recipe.locked svg { opacity: .45; filter: grayscale(.6); }
.recipe .soon {
  position: absolute; top: -12px; right: 12px; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px; padding: 2px 10px; font: 800 .85rem var(--body);
}
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.book .entry { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 18px; text-align: inherit; }
/* delete cross: shows on hover with a mouse, always shows (smaller) on touch screens */
.book .bookitem { position: relative; }
.book .entry { width: 100%; }
.book .del {
  position: absolute; top: -10px; right: -10px; z-index: 1; height: 34px; min-width: 34px; padding: 0 7px; border-radius: 999px;
  border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink), var(--soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px; font: 800 .85rem var(--body);
  opacity: 0; transform: scale(.7); transition: opacity .15s ease, transform .15s ease, background .15s ease;
}
.book .del svg { width: 16px; height: 16px; flex: none; }
.book .del span { display: none; }
.book .bookitem:hover .del, .book .del:focus-visible, .book .del.ask { opacity: 1; transform: none; }
.book .del.ask { background: var(--tomato); color: #fff; }
.book .del.ask svg path { stroke: #fff; }
.book .del.ask span { display: inline; }
@media (hover: none) {
  .book .del { opacity: .9; transform: scale(.85); }
}
.book figure { margin: 0; background: #fff; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 4px 0 var(--ink), var(--soft); transition: transform .12s ease; }
.book .entry:hover figure { transform: translateY(-2px) rotate(-1deg); }
.book .entry:active figure { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
/* Cookbook viewer */
.viewer {
  position: fixed; inset: 0; z-index: 9; background: rgba(42, 35, 64, .6); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.viewcard {
  position: relative; width: min(520px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 30px; box-shadow: 0 8px 0 var(--ink), var(--soft);
  padding: 22px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.viewcard h2 { margin: 0; font: 800 clamp(1.6rem, 6vw, 2.1rem)/1 var(--display); }
.viewcard p { margin: 0; font: 800 1rem var(--body); color: var(--muted); }
.viewdish { width: min(100%, 60vh, 440px); aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--ink); overflow: hidden; background: #fff; }
.viewdish img { width: 100%; height: 100%; display: block; }
.viewnav { display: flex; gap: 12px; align-items: center; justify-content: center; }
.viewnav .round:disabled { opacity: .35; cursor: default; }
.viewclose { position: absolute; top: -18px; right: -12px; }
.book img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.book figcaption { font: 800 .8rem var(--body); text-align: center; padding: 4px; color: var(--muted); }
.empty { margin: 0; font-weight: 800; color: var(--muted); grid-column: 1 / -1; }
.finish .inner { align-items: center; text-align: center; }
.finish .dish {
  width: min(78vw, 46vh, 420px); aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--ink); overflow: hidden; background: #fff;
  box-shadow: 0 8px 0 var(--ink), var(--soft); animation: present .7s cubic-bezier(.3, 1.6, .5, 1);
}
.finish .dish img { width: 100%; height: 100%; display: block; }
.finish p { margin: 0; font: 800 1.2rem var(--body); }
.btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 440px) {
  .tools { gap: 6px; justify-content: flex-start; }
  .tool { width: 54px; height: 68px; border-radius: 16px; font-size: .7rem; }
  .tool svg { width: 32px; height: 32px; }
}
@media (max-height: 560px) {
  :root { --tray-h: 136px; }
  .tool { height: 64px; width: 62px; }
  .tool svg { width: 32px; height: 32px; }
  .say-row { min-height: 54px; }
  .next { min-height: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  .next, .finish .dish { animation: none; }
  .cat { transition: none; }
}
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Kitchen counter"></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <button class="round wide" id="backBtn" type="button" hidden>
    <svg viewBox="0 0 32 32" style="width:22px;height:22px"><path d="M20 6 L10 16 L20 26" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="backLabel">Kitchen</span>
  </button>
  <div class="title" id="title">Cosy Kitchen</div>
  <nav class="steps" id="steps" hidden aria-label="Cooking steps"></nav>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="tray" id="tray" hidden>
  <div class="say-row"><button class="round undo" id="undoBtn" type="button" aria-label="Undo" title="Undo" hidden><svg viewBox="0 0 32 32"><path d="M11 9 L5 15 L11 21" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15 H19 Q27 15 27 22 Q27 27 21 27" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/></svg></button><div class="say" id="say" aria-live="polite"></div><button class="next" id="nextBtn" type="button" hidden><span id="nextLabel">Next</span><svg viewBox="0 0 32 32"><path d="M12 6 L22 16 L12 26" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="tools" id="tools"></div>
</div>

<section class="screen" id="menu" aria-labelledby="menuTitle">
  <div class="inner">
    <h2 id="menuTitle">What shall we cook?</h2>
    <div class="recipes" id="recipes"></div>
    <h3>My cookbook</h3>
    <div class="book" id="book"></div>
  </div>
</section>

<div class="viewer" id="viewer" hidden>
  <div class="viewcard" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
    <button class="round viewclose" id="viewClose" type="button" aria-label="Close">
      <svg viewBox="0 0 32 32"><path d="M9 9 L23 23 M23 9 L9 23" stroke="#2A2340" stroke-width="4" stroke-linecap="round"/></svg>
    </button>
    <h2 id="viewTitle">Dish</h2>
    <div class="viewdish"><img id="viewImg" alt=""></div>
    <p id="viewDate"></p>
    <div class="viewnav">
      <button class="round" id="viewPrev" type="button" aria-label="Newer dish"><svg viewBox="0 0 32 32"><path d="M20 6 L10 16 L20 26" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round" id="viewNext" type="button" aria-label="Older dish"><svg viewBox="0 0 32 32"><path d="M12 6 L22 16 L12 26" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>

<section class="screen finish" id="finish" hidden aria-labelledby="finishTitle">
  <div class="inner">
    <h2 id="finishTitle">Sushi handroll!</h2>
    <div class="dish"><img id="dishImg" alt="Your sushi handroll on a plate"></div>
    <p id="finishNote"></p>
    <div class="btnrow">
      <button class="big go" id="againBtn" type="button">Cook again</button>
      <button class="big" id="toMenuBtn" type="button">Kitchen</button>
    </div>
  </div>
</section>

<div class="cat" id="cat" aria-live="polite">
  <div class="bubble" id="catSays">Great job!</div>
  <span data-cat='{"preset":"chef","pose":"wave"}'></span>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/scene.js"></script>
<script src="../../shared/dishes.js"></script>
<script src="game.js"></script>
</body>
</html>
