<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitten Kitchen</title>
<meta name="theme-color" content="#FFE9D6">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">

<link rel="stylesheet" href="../../shared/game.css">
<style>
/* Toddler game: pick a pizza, pancakes or a birthday cake (big pictures on the canvas), then pick a topping from
   the tray and tap or drag on the food to decorate it. The bell serves it to your cat. No words needed, nothing to
   get wrong. Single bright look by design. */
body { background: #FFE2C7; }
.middle { flex: 1; display: flex; justify-content: center; }
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--cream); border-top: 4px solid var(--ink);
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; transition: opacity .25s ease;
}
.tray.off { opacity: .35; pointer-events: none; }
.tray[hidden] { display: none; }
.top {
  width: 84px; height: 84px; border: 4px solid var(--ink); border-radius: 24px; background: #fff; box-shadow: 0 5px 0 var(--ink); cursor: pointer; padding: 0;
  display: grid; place-items: center;
}
.top img { width: 70px; height: 70px; pointer-events: none; }
.top[aria-pressed="true"] { background: var(--sun); transform: translateY(-4px); box-shadow: 0 9px 0 var(--ink); }
/* the cake's icing colours: a row of big round swatches above its toppings */
.swatches { flex-basis: 100%; display: flex; justify-content: center; gap: 14px; }
.swatch { width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--ink); background: var(--c); box-shadow: 0 4px 0 var(--ink); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { transform: translateY(-3px); box-shadow: 0 7px 0 var(--ink); outline: 4px solid var(--sun); outline-offset: 3px; }
.bell {
  position: fixed; z-index: 8; width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--ink); background: var(--grass);
  box-shadow: 0 5px 0 var(--ink); cursor: pointer; padding: 0; display: grid; place-items: center; transition: transform .2s ease, opacity .2s ease;
}
.bell svg { width: 66px; height: 66px; }
.bell[hidden] { display: none; }
.bell.ready { animation: nudge 1.2s ease-in-out infinite; }
.bell:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateY(-6px) rotate(-6deg); } }
@media (max-width: 460px) {
  .tray { gap: 10px; }
  .top { width: 74px; height: 74px; border-radius: 20px; }
  .top img { width: 60px; height: 60px; }
  .swatches { gap: 10px; }
  .swatch { width: 46px; height: 46px; }
  .bell { width: 84px; height: 84px; }
  .bell svg { width: 56px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) { .bell.ready { animation: none; outline: 4px dashed var(--sun); outline-offset: 3px; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Kitten Kitchen. Pick a pizza, pancakes or a birthday cake, then tap toppings on to decorate it and ring the bell to give it to your cat."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle"></div>
  <button class="round" id="foodsBtn" type="button" aria-label="Pick a different food" hidden>
    <svg viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="13" ry="9" fill="#fff" stroke="#2A2340" stroke-width="2.6"/><ellipse cx="16" cy="17" rx="7.5" ry="4.5" fill="#FFD3E4" stroke="#2A2340" stroke-width="2"/><path d="M10 8 L13 11 M16 6 V10 M22 8 L19 11" stroke="#2A2340" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="tray" id="tray" hidden></div>
<button class="bell" id="bell" type="button" aria-label="It's ready! Give it to the cat" hidden>
  <svg viewBox="0 0 64 64"><path d="M10 46 H54" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><path d="M14 44 Q14 18 32 18 Q50 18 50 44 Z" fill="#FFD23F" stroke="#2A2340" stroke-width="4.5" stroke-linejoin="round"/><circle cx="32" cy="14" r="4.5" fill="#FFD23F" stroke="#2A2340" stroke-width="3.5"/><path d="M22 36 Q22 26 30 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
</button>

<script src="../../shared/store.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/scene.js"></script>
<script src="../../shared/dishes.js"></script>
<script src="game.js"></script>
</body>
</html>
