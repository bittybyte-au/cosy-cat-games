<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rooftop Run</title>
<meta name="theme-color" content="#1F1B3D">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../shared/site.css">
<link rel="stylesheet" href="../../shared/game.css">
<style>
/* A one-tap runner for older kids: your cat runs across the city's rooftops at night. Tap to jump (tap again in
   the air for a second jump, hold for a higher one), collect fish, and land on chimneys rather than running into
   them. Each run is about a minute; the only score is how far you got. One canvas; the top bar shows the distance
   and fish. Single night look by design. */
body { background: #1F1B3D; }
.middle { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; }
.pill2 { display: flex; align-items: center; gap: 6px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px 3px 8px; box-shadow: 0 3px 0 var(--ink); font: 800 1rem/1 var(--display); white-space: nowrap; }
.pill2 svg { width: 24px; height: 24px; flex: none; }
.pill2.bump { animation: bump .35s ease; }
.card canvas { width: min(220px, 56vw); height: auto; display: block; }
.card .tip { font: 800 .95rem var(--body); color: var(--muted); }
.card .best { font: 800 1rem var(--body); color: var(--ink); }
#stage { touch-action: none; }
@media (max-width: 400px) { .pill2 { font-size: .9rem; padding: 4px 9px 2px 6px; } .pill2 svg { width: 20px; height: 20px; } }
</style>
</head>
<body class="game">
<canvas id="stage" aria-label="Rooftop Run. Tap or press space to jump, tap again in the air to jump once more, and hold for a higher jump."></canvas>

<div class="topbar" id="topbar">
  <a class="round" id="homeBtn" href="../../play/index.html" aria-label="Back to all games">
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="3" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="3" fill="#FFD23F" stroke="#2A2340" stroke-width="2.6"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="3" fill="#7BD389" stroke="#2A2340" stroke-width="2.6"/></svg>
  </a>
  <div class="middle">
    <div class="pill2" aria-label="Distance"><svg viewBox="0 0 32 32"><path d="M6 26 V8 M6 8 H24 L20 12.5 L24 17 H6" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b id="dist">0 m</b></div>
    <div class="pill2" id="fishPill" aria-label="Fish"><svg viewBox="0 0 32 32"><path d="M4 16 Q12 7 21 12 L28 7 V25 L21 20 Q12 25 4 16 Z" fill="#7CC4FF" stroke="#2A2340" stroke-width="2.6" stroke-linejoin="round"/><circle cx="11" cy="15" r="1.8" fill="#2A2340"/></svg><b id="fish">0</b></div>
  </div>
  <button class="round" id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"></button>
</div>

<div class="card-wrap" id="cardWrap">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <canvas id="cardPic" width="440" height="300" aria-hidden="true"></canvas>
    <h2 id="cardTitle">Rooftop Run</h2>
    <p id="cardNote">Run across the rooftops! Jump the gaps and hop up onto the chimneys.</p>
    <p class="best" id="cardBest"></p>
    <p class="tip" id="cardTip">Tap to jump. Tap again in the air to jump once more. Hold for a higher jump.</p>
    <button class="big" id="goBtn" type="button">Run!</button>
  </div>
</div>

<script src="../../shared/store.js"></script>
<script src="../../shared/draw.js"></script>
<script src="../../shared/cat.js"></script>
<script src="../../shared/avatar.js"></script>
<script src="game.js"></script>
</body>
</html>
