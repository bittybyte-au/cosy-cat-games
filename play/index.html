<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosy Cat Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Our family's little collection of games.">
<meta name="theme-color" content="#9EDCFF">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cosy Cat Games">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../shared/site.css">
<style>
/* Games home layout. Shared look: shared/site.css. A sunny garden sky; game tiles sit on a grassy hill. */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(var(--sky) 0 55%, var(--sky-deep)); }
.sky > * { position: absolute; }
.cloud1 { top: 44vh; left: -30px; width: 190px; animation: drift 60s linear infinite; }
.cloud2 { top: 30vh; right: -40px; width: 150px; animation: drift 80s linear infinite reverse; }
.hill { left: 0; right: 0; bottom: 0; width: 100%; height: 38vh; }
.paws { left: 0; right: 0; bottom: 0; width: 100%; height: 130px; }
@keyframes drift { from { transform: translateX(0) } to { transform: translateX(40vw) } }

.wrap {
  position: relative; z-index: 1;
  padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px; min-height: 100vh; min-height: 100svh;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .5px; }
h1 a { color: inherit; text-decoration: none; }
.head-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* the player chip and the toddler switch */
.player-chip { position: relative; padding: 6px 16px 6px 6px; min-height: 60px; font-size: 1.1rem; }
.player-chip svg { width: 46px; height: 46px; flex: none; }
.plus { width: 46px; height: 46px; border-radius: 50%; background: var(--grass); border: 3px solid var(--ink); display: grid; place-items: center; font: 800 1.8rem/1 var(--display); }
.new-dot { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--tomato); border: 3px solid var(--ink); }
.toddler-chip { gap: 8px; padding: 0 14px 0 8px; }
.toddler-chip .knob { position: relative; width: 44px; height: 26px; border-radius: 999px; background: #D8D2E4; border: 3px solid var(--ink); flex: none; }
.toddler-chip .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: left .2s ease; }
.toddler-chip[aria-pressed="true"] { background: var(--sun); }
.toddler-chip[aria-pressed="true"] .knob { background: var(--grass); }
.toddler-chip[aria-pressed="true"] .knob::after { left: 20px; }
.toddler-chip { min-height: 48px; }
.av-foot #todSwitch { flex-basis: 100%; justify-content: flex-start; text-align: left; }
.toddler-chip > svg { width: 24px; height: 24px; flex: none; }
.tod-dot { position: absolute; left: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; background: #C7EBD2; border: 2.5px solid var(--ink); display: grid; place-items: center; }
.tod-dot svg { width: 18px; height: 18px; }

@media (max-width: 400px) {
  .player-chip { padding-right: 10px; font-size: 1rem; min-height: 54px; }
  .player-chip svg, .plus { width: 40px; height: 40px; }
  .player-chip > span:not(.new-dot):not(.plus) { max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
.sum-q { text-align: center; font: 800 1.4rem var(--body); }
#sumIn { text-align: center; }
.confirm-text { text-align: center; font: 800 1.3rem var(--body); }

/* your own cat (your avatar) says hello */
.hello { display: flex; align-items: center; gap: 4px; margin-block: -6px -4px; }
.mascot { width: 96px; flex: none; animation: bob 2.6s ease-in-out infinite; }
.mascot svg { display: block; width: 100%; height: auto; }
.greeting {
  position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 10px 18px;
  font: 800 1.3rem/1.2 var(--body); box-shadow: 0 4px 0 var(--ink), var(--soft); min-width: 0;
}
.greeting::before { content: ""; position: absolute; left: -15px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right: 14px solid var(--ink); border-left: 0; }
.greeting::after { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right: 10px solid #fff; border-left: 0; }

/* game tiles */
.tiles { margin-top: 50px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 54px 18px; }
/* compact tiles: just the picture and the name, so two fit side by side on a phone */
.tiles .tile { padding: 12px 12px 14px; align-items: center; text-align: center; border-radius: 26px; }
.tiles .art { flex: none; width: 100%; height: 130px; }
.tiles .art svg { max-height: 100%; }
.tiles .tile h2 { font-size: 1.45rem; text-wrap: balance; }
.tiles .tile .ear { width: 48px; height: 35px; top: -34px; }
.tiles .tile .ear.l { left: 14px; }
.tiles .tile .ear.r { right: 14px; }
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 46px 12px; }
  .tiles .art { height: 100px; }
  .tiles .tile h2 { font-size: 1.2rem; }
  .tiles .tile .ear { width: 40px; height: 29px; top: -28px; }
  .tiles .tile .ear.l { left: 12px; }
  .tiles .tile .ear.r { right: 12px; }
  /* just the rattle between the ears on a narrow tile */
  .tile .tod-tag { padding: 3px; }
  .tile .tod-tag > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
}
/* toddler games carry a little rattle tag between the tile's ears */
.tile .tod-tag {
  position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; align-items: center; gap: 5px;
  background: #C7EBD2; border: 3px solid var(--ink); border-radius: 999px; padding: 3px 11px 3px 6px; font: 800 .9rem var(--body); white-space: nowrap;
}
.tile .tod-tag svg { width: 22px; height: 22px; }
body.toddler .tile .tod-tag { display: none; }

/* avatar builder (layout from Lily's sketch) */
.panel.av-builder {
  position: relative; width: min(940px, 100%); display: grid; gap: 16px 18px; align-items: start;
  grid-template-columns: auto minmax(0, 1.1fr) minmax(0, 1fr);
  grid-template-areas: "title title title" "rail list stage" "foot foot foot";
}
.av-title { grid-area: title; }
.av-close { position: absolute; top: 14px; right: 14px; width: 52px; height: 52px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink), var(--soft); cursor: pointer; }
.av-close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
.av-close svg { width: 26px; height: 26px; }
.av-rail { grid-area: rail; display: flex; flex-direction: column; gap: 12px; padding: 10px; background: #fff; border: 3px solid var(--ink); border-radius: 26px; }
.av-cat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; cursor: pointer; font: 800 .8rem/1.1 var(--body); color: var(--ink); }
.av-ic { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink), var(--soft); }
.av-ic svg { width: 40px; height: 40px; }
.av-cat[aria-selected="true"] .av-ic { background: var(--sun); transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink), var(--soft); }
.av-list { grid-area: list; min-height: 300px; max-height: min(56vh, 520px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 6px 8px 2px; }
.av-listtitle { margin: 0; font: 800 1.4rem/1 var(--display); }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.av-sq { position: relative; aspect-ratio: 1; display: grid; place-items: center; padding: 6px; border: 3px solid var(--ink); border-radius: 20px; background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--ink), var(--soft); }
.av-sq svg { width: 100%; height: auto; max-width: 72px; }
.av-sq[aria-pressed="true"] { background: var(--sun); }
.av-sq:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink), var(--soft); }
.av-sq.locked { border-style: dashed; box-shadow: none; background: #F3EEF8; }
.av-sq.locked > svg { opacity: .55; }
.av-lock { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 2px solid var(--ink); }
.av-lock svg { width: 13px; height: 13px; }
.av-sq.fresh::after { content: ""; position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--tomato); border: 3px solid var(--ink); }
.av-sq.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.av-tip { margin: 0; min-height: 1.4em; font: 800 .95rem/1.3 var(--body); color: var(--muted); }
.av-tip svg { width: 13px; height: 13px; vertical-align: -1px; }
.av-swgroup { display: flex; flex-direction: column; }
.av-sw { display: flex; flex-wrap: wrap; gap: 8px; }
.av-sw > button, .av-custom { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; }
.av-sw > button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 2px; }
.av-custom { position: relative; display: grid; place-items: center; background: conic-gradient(#FF6B57, #FFC93C, #7BD389, #3FA7F5, #9B7BFF, #FF7EB6, #FF6B57); font: 800 1.4rem/1 var(--body); color: #fff; text-shadow: 0 1px 2px var(--ink); }
.av-custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.av-stage { grid-area: stage; display: flex; flex-direction: column; align-items: center; gap: 0; padding-top: 6px; }
.av-prev { position: relative; z-index: 1; width: 160px; margin-bottom: -26px; }
.av-prev svg { width: 160px; height: 160px; }
.av-cushion { width: 210px; height: 56px; border-radius: 50%; background: #FFB3C7; border: 4px solid var(--ink); box-shadow: inset 0 -10px 0 #FF8FAB, 0 6px 0 var(--ink); }
.av-nick { width: 100%; margin-top: 22px; }
.av-hint-text { font-weight: 700; color: var(--muted); font-size: .9rem; }
.av-foot { grid-area: foot; display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex-wrap: wrap; }
.av-foot .note { flex: 1; text-align: left; }
@media (max-width: 760px) {
  .panel.av-builder { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "stage" "rail" "list" "foot"; }
  .av-title { padding-right: 56px; text-align: left; }
  .av-rail { flex-direction: row; justify-content: space-around; padding: 8px; }
  .av-ic { width: 56px; height: 56px; }
  .av-list { max-height: none; min-height: 0; overflow: visible; }
  .av-prev, .av-prev svg { width: 130px; height: 130px; }
  .av-cushion { width: 170px; height: 46px; }
  .av-foot .btn { flex: 1; }
}
/* footer */
.foot { display: flex; justify-content: center; text-align: center; font-size: .95rem; margin: 8px 0 0; }
.foot-note { display: inline-flex; align-items: center; gap: 8px; opacity: .75; }
.paw { width: 18px; height: 18px; fill: currentColor; vertical-align: -3px; }
.site-foot { margin-top: auto; padding-top: 24px; }

@media (prefers-reduced-motion: reduce) {
  .cloud1, .cloud2, .mascot, .av-sq.shake { animation: none; }
  .toddler-chip .knob::after { transition: none; }
}
</style>
</head>

  <svg class="cloud2" viewBox="0 -6 200 86"><g data-cat-ears='{"x":98,"y":30,"k":0.62}'></g><path d="M30 70 Q5 70 10 50 Q12 32 38 36 Q45 10 80 16 Q100 0 125 18 Q160 12 165 40 Q195 42 188 62 Q185 72 165 70 Z" fill="#fff" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><path d="M92 46 Q96 50 100 46 Q104 50 108 46" fill="none" stroke="#2A2340" stroke-width="3" stroke-linecap="round"/><circle cx="88" cy="38" r="3" fill="#2A2340"/><circle cx="112" cy="38" r="3" fill="#2A2340"/></svg>

<div class="wrap">
  <header>
    <h1 class="sticker-title"><a href="../index.html">Cosy Cat Games</a></h1>
    <div class="head-btns">
      <button class="chip player-chip" id="playerChip" type="button" aria-label="Change your nickname or cat"></button>
      <a class="round" id="homeBtn" href="../games/home/index.html" aria-label="My cosy home" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 16 5l11 10" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v13h16V13" fill="#FFC93C" stroke="#2A2340" stroke-width="3" stroke-linejoin="round"/><path d="M13.5 26v-6.5h5V26" fill="#FF6B57" stroke="#2A2340" stroke-width="2.5" stroke-linejoin="round"/></svg></a>
    </div>
  </header>
  <div class="hello"><span class="mascot" id="mascot" aria-hidden="true"></span><p class="greeting" id="greeting"></p></div>

  <div id="installBanner" hidden></div>
  <main class="tiles" id="tiles">
    <div class="tile more" aria-label="More games coming soon">
      <span class="sleepy" data-cat='{"preset":"chef","hat":"none","pose":"lie","face":"sleep","zzz":true}'></span>

      <p>coming soon</p>
    </div>
  </main>

  <footer class="site-foot pills"><a class="pill" href="../about/index.html">About Cosy Cat Games</a><a class="pill" href="../faq/index.html">Questions (FAQ)</a><a class="pill" href="../feedback/index.html">Send feedback</a></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" id="panel"></div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/cat.js"></script>
<script src="../shared/games.js"></script>
<script src="../shared/avatar.js"></script>
<script src="../shared/install.js"></script>
<script>
(function () {
  var chip = document.getElementById('playerChip');
  var greet = document.getElementById('greeting');
  var mascot = document.getElementById('mascot');
  var mascotKey = '';
  /* the cat saying hello is the player's own avatar; before there's a player, a plain waving cat */
  function renderMascot(p) {
    var av = p ? GGAvatar.normalise(p.avatar, p.color) : null;
    var key = av ? JSON.stringify(av) : 'none';
    if (key === mascotKey) return;
    mascotKey = key;
    if (av) mascot.innerHTML = GGAvatar.svg(av, 96);
    else if (window.GGCat && GGCat.svg) mascot.innerHTML = GGCat.svg({ preset: 'ginger', pose: 'wave', size: 96 });
  }
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  var RATTLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 13.5 L20 20" stroke="#2A2340" stroke-width="3.2" stroke-linecap="round"/><circle cx="20" cy="20" r="2.6" fill="#FFD23F" stroke="#2A2340" stroke-width="1.8"/><circle cx="9" cy="9" r="7" fill="#FF8FAB" stroke="#2A2340" stroke-width="2.2"/><circle cx="7" cy="7" r="1.6" fill="#fff"/><circle cx="11" cy="10.5" r="1.3" fill="#fff"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function renderHeader() {
    var p = GG.current();
    renderMascot(p);
    if (p) {
      var fresh = newItems(p);
      chip.innerHTML = GGAvatar.svg(GGAvatar.normalise(p.avatar, p.color), 46) + '<span>' + esc(p.name) + '</span>' + (toddlerOn() ? '<span class="tod-dot" title="Toddler profile">' + RATTLE + '</span>' : '') + (fresh.length ? '<span class="new-dot" aria-label="New things to wear"></span>' : '');
      greet.textContent = fresh.length
        ? 'You earned ' + (fresh.length > 1 ? fresh.length + ' new things' : article(GGAvatar.item(fresh[0]).name + (GGAvatar.TYPES.some(function (t) { return t.id === fresh[0]; }) ? ' cat' : ''))) + '! Tap your picture to try ' + (fresh.length > 1 ? 'them' : 'it') + ' on.'
        : 'Hi ' + p.name + '! Pick a game.';
    } else {
      chip.innerHTML = '<span class="plus">+</span><span>Add your name</span>';
      greet.textContent = 'Pick a game.';
    }
    GGGames.all.forEach(function (g) {
      var b = document.querySelector('.tile[data-game="' + g.id + '"] .badge');
      if (!b || !g.badge) return;
      var txt = g.badge(GG.getProgress(g.save));
      b.hidden = !txt; b.textContent = txt;
    });
  }

  function open() { overlay.hidden = false; }
  function close() { overlay.hidden = true; renderHeader(); }

  /* earned avatar items the player hasn't seen yet */
  function newItems(p) { var seen = p.seen || []; return GGAvatar.unlocked(GG).filter(function (id) { return seen.indexOf(id) < 0; }); }
  function article(name) { var n = name.charAt(0).toLowerCase() + name.slice(1); return (/^[aeiou]/.test(n) ? 'an ' : 'a ') + n; }

  /* one player per device: the first visit asks for a name and builds a cat; the chip changes them later */
  /* the avatar screen, from Lily's sketch: category buttons down the side, a list of things to wear,
     the cat on a cushion in the middle, close at the top and Save at the bottom */
  var ICONS = {
    head: '<svg viewBox="0 0 40 40"><rect x="13" y="7" width="14" height="17" rx="2" fill="#3A3350"/><rect x="13" y="19" width="14" height="4" fill="#FF6B57"/><ellipse cx="20" cy="26" rx="15" ry="4.5" fill="#3A3350"/></svg>',
    face: '<svg viewBox="0 0 40 40"><g fill="#2A2340"><rect x="5" y="14" width="13" height="10" rx="4"/><rect x="22" y="14" width="13" height="10" rx="4"/></g><path d="M18 17 L22 17" stroke="#2A2340" stroke-width="3"/><path d="M8 17 L12 17 M25 17 L29 17" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
    type: '',
    colours: '<svg viewBox="0 0 40 40"><path d="M27 5 L33 11 L19 25 L13 19 Z" fill="#C98B5B" stroke="#2A2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 19 L19 25 Q17 33 8 34 Q9 25 13 19 Z" fill="#FF7EB6" stroke="#2A2340" stroke-width="2.5" stroke-linejoin="round"/></svg>'
  };
  var CATS = [['head', 'Hats & hair'], ['face', 'Face'], ['type', 'Cat'], ['colours', 'Colours']];
  function showSetup(tab) {
    var p = GG.current();
    var av = p ? GGAvatar.normalise(p.avatar, p.color) : GGAvatar.random();
    var got = GGAvatar.unlocked(GG);
    var fresh = p ? newItems(p) : [];
    var listFor = { type: GGAvatar.TYPES, head: GGAvatar.HEADS, face: GGAvatar.FACES };
    tab = tab || (fresh.length ? ['type', 'head', 'face'].filter(function (k) { return listFor[k].some(function (t) { return t.id === fresh[0]; }); })[0] : (p ? 'head' : 'type'));
    if (!ICONS.type) ICONS.type = GGCat.svg({ preset: 'ginger', face: 'happy', size: 40 });
    panel.classList.add('av-builder');
    panel.innerHTML =
      (p ? '<button class="av-close" type="button" id="backBtn" aria-label="Close without saving"><svg viewBox="0 0 32 32"><path d="M9 9 L23 23 M23 9 L9 23" stroke="#2A2340" stroke-width="4" stroke-linecap="round"/></svg></button>' : '') +
      '<h2 id="panelTitle" class="av-title">' + (p ? 'Your cat' : 'Hello! Make your cat') + '</h2>' +
      '<div class="av-rail" role="tablist" aria-label="What to change">' + CATS.map(function (c) {
        return '<button type="button" class="av-cat" role="tab" data-tab="' + c[0] + '" aria-label="' + c[1] + '"><span class="av-ic">' + ICONS[c[0]] + '</span><span class="av-catname">' + c[1] + '</span></button>';
      }).join('') + '</div>' +
      '<div class="av-list" id="avPane" role="tabpanel"></div>' +
      '<div class="av-stage"><div class="av-prev" id="avPrev"></div><div class="av-cushion" aria-hidden="true"></div>' +
      '<div class="av-nick"><label class="field-label" for="nameInput">Nickname <span class="av-hint-text">(e.g. Unicorn15, don’t use your real name)</span></label>' +
      '<input class="field big" id="nameInput" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Unicorn15"></div></div>' +
      '<div class="av-foot">' + (p && toddlerReady() ? '<button class="toddler-chip chip" type="button" id="todSwitch" aria-pressed="' + toddlerOn() + '">' + RATTLE + '<span class="knob" aria-hidden="true"></span><span>Make this a toddler profile</span></button>' : '') + '<p class="note">Saved on this device only. No sign-up needed.</p><button class="btn go" type="button" id="saveBtn">' + (p ? 'Save' : 'Let’s play!') + '</button></div>';
    open();
    var input = document.getElementById('nameInput'), save = document.getElementById('saveBtn'), pane = document.getElementById('avPane');
    input.value = p ? p.name : '';
    function preview() { document.getElementById('avPrev').innerHTML = GGAvatar.svg(av, 160); }
    function rows(list, key) {
      return list.map(function (it) {
        var locked = it.earn && got.indexOf(it.id) < 0 && av[key] !== it.id;
        var trial = {}; for (var k in av) trial[k] = av[k]; trial[key] = it.id;
        return '<button type="button" class="av-sq' + (locked ? ' locked' : '') + (fresh.indexOf(it.id) >= 0 ? ' fresh' : '') + '" data-key="' + key + '" data-id="' + it.id + '"' +
          ' aria-pressed="' + (av[key] === it.id) + '" aria-label="' + esc(it.name) + (locked ? ', locked: ' + esc(it.earn.hint) : '') + '" title="' + esc(locked ? it.earn.hint : it.name) + '">' +
          GGAvatar.svg(trial, 72) + (locked ? '<span class="av-lock">' + LOCK + '</span>' : '') + '</button>';
      }).join('');
    }
    function swatches(list, key, label) {
      return '<div class="av-swgroup"><span class="field-label">' + label + '</span><div class="av-sw">' + list.map(function (c) {
        return '<button type="button" data-key="' + key + '" data-col="' + c + '" aria-label="' + label + ' ' + c + '" aria-pressed="' + (av[key].toLowerCase() === c.toLowerCase()) + '" style="background:' + c + '"></button>';
      }).join('') + '<label class="av-custom" title="Pick any colour"><input type="color" data-key="' + key + '" value="' + av[key] + '" aria-label="Pick any ' + label.toLowerCase() + '"><span aria-hidden="true">+</span></label></div></div>';
    }
    function draw() {
      preview();
      panel.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
      var title = CATS.filter(function (c) { return c[0] === tab; })[0][1];
      var head = '<h3 class="av-listtitle">' + title + '</h3>';
      if (tab === 'colours') pane.innerHTML = head + swatches(GGAvatar.CAT_COLOURS, 'color', 'Cat colour') + (av.type === 'calico' ? '<p class="note">Calico cats are always white with patches.</p>' : av.type === 'tuxedo' ? '<p class="note">Tuxedo cats are always black and white.</p>' : '') + swatches(GGAvatar.BG_COLOURS, 'bg', 'Background');
      else pane.innerHTML = head + '<div class="av-grid">' + rows(listFor[tab], tab) + '</div><p class="av-tip" id="avTip" aria-live="polite"></p>';
      pane.querySelectorAll('.av-sq').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.classList.contains('locked')) {
            b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
            document.getElementById('avTip').innerHTML = LOCK + ' ' + esc(GGAvatar.item(b.dataset.id).earn.hint) + ' to unlock this.';
            return;
          }
          av[b.dataset.key] = b.dataset.id; draw();
        });
      });
      pane.querySelectorAll('.av-sw > button').forEach(function (b) { b.addEventListener('click', function () { av[b.dataset.key] = b.dataset.col; draw(); }); });
      pane.querySelectorAll('input[type=color]').forEach(function (inp) {
        inp.addEventListener('input', function () { av[inp.dataset.key] = inp.value; preview(); });
        inp.addEventListener('change', function () { av[inp.dataset.key] = inp.value; draw(); });
      });
    }
    panel.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { tab = b.dataset.tab; draw(); }); });
    draw();
    function ready() { save.disabled = !input.value.trim(); }
    ready();
    input.addEventListener('input', ready);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && input.value.trim()) save.click(); });
    function markSeen() { if (GG.current()) GG.setPlayerInfo({ seen: GGAvatar.unlocked(GG) }); }
    var back = document.getElementById('backBtn'); if (back) back.addEventListener('click', function () { markSeen(); close(); });
    save.addEventListener('click', function () { GG.addPlayer(input.value.trim(), av); markSeen(); close(); });
    if (!p) setTimeout(function () { input.focus(); }, 50);
    var ts = document.getElementById('todSwitch'); if (ts) ts.addEventListener('click', toddlerFlow);
  }
  var LOCK = '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="3" fill="#5E5675"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#5E5675" stroke-width="2.6"/></svg>';

  chip.addEventListener('click', function () { showSetup(); });
  var EAR_L = GGCat.earSVG(-1, 'ear l'), EAR_R = GGCat.earSVG(1, 'ear r');
  /* Toddler mode shows only toddler games. The switch stays hidden until there are 3 toddler games to play. */
  // Cosy Home has no tile; it is the house button instead, shown once the game can be played
  var homeGame = GGGames.get('home');
  document.getElementById('homeBtn').hidden = !(homeGame && GGGames.playable(homeGame));

  function toddlerGames() { return GGGames.visible({ toddler: true }).filter(GGGames.playable); }
  function toddlerReady() { return toddlerGames().length >= 3; }
  function toddlerOn() { return toddlerReady() && !!GG.getSetting('toddler', false); }
  function renderTiles() {
    var box = document.getElementById('tiles'), sleepy = box.querySelector('.tile.more');
    box.querySelectorAll('.tile[data-game]').forEach(function (t) { t.remove(); });
    var tod = toddlerOn();
    document.body.classList.toggle('toddler', tod);
    sleepy.hidden = tod;
    GGGames.visible(tod ? { toddler: true } : {}).forEach(function (g) {
      var ok = GGGames.playable(g);
      var t = document.createElement(ok ? 'a' : 'div');
      t.className = 'tile' + (ok ? '' : ' coming');
      t.dataset.game = g.id;
      t.style.setProperty('--tile', g.colour);
      if (ok) t.href = '../games/' + g.id + '/index.html';
      else t.setAttribute('aria-label', g.name + ', coming soon');
      t.innerHTML = EAR_L + EAR_R +
        '<span class="badge"' + (ok ? ' hidden' : '') + '>' + (ok ? '' : 'Coming soon') + '</span>' +
        (g.toddler ? '<span class="tod-tag" title="A game for toddlers">' + RATTLE + '<span>Toddler</span></span>' : '') +
        '<div class="art" aria-hidden="true">' + g.art + '</div><h2>' + esc(g.name) + '</h2>';
      if (ok) t.addEventListener('click', function (e) {
        if (!GG.current()) { e.preventDefault(); showSetup(); }
      });
      box.insertBefore(t, sleepy);
    });
  }
  renderTiles();

  function toddlerFlow() {
    panel.classList.remove('av-builder');
    if (!toddlerOn()) {
      panel.innerHTML = '<h2 id="panelTitle">Turn on toddler mode?</h2>' +
        '<p class="confirm-text">Only the simplest games will show, made for little ones under 5.</p>' +
        '<p class="note">To turn it off again, a grown-up answers a quick sum.</p>' +
        '<div class="row"><button class="btn plain" type="button" id="todNo">Not now</button><button class="btn go" type="button" id="todYes">Turn on</button></div>';
      open();
      document.getElementById('todNo').addEventListener('click', close);
      document.getElementById('todYes').addEventListener('click', function () { GG.setSetting('toddler', true); close(); renderTiles(); });
      return;
    }
    (function ask() {
      var x = 4 + Math.floor(Math.random() * 6), y = 3 + Math.floor(Math.random() * 7);
      panel.innerHTML = '<h2 id="panelTitle">Turn off toddler mode?</h2>' +
        '<p class="sum-q">Grown-ups: what is ' + x + ' + ' + y + '?</p>' +
        '<input class="field big" id="sumIn" inputmode="numeric" autocomplete="off" aria-label="Answer">' +
        '<p class="note" id="sumMsg"></p>' +
        '<div class="row"><button class="btn plain" type="button" id="sumNo">Keep it on</button><button class="btn go" type="button" id="sumYes">Turn off</button></div>';
      open();
      var input = document.getElementById('sumIn');
      setTimeout(function () { input.focus(); }, 50);
      function check() {
        if (parseInt(input.value, 10) === x + y) { GG.setSetting('toddler', false); close(); renderTiles(); }
        else { document.getElementById('sumMsg').textContent = 'Not quite. Try this one.'; setTimeout(ask, 900); }
      }
      document.getElementById('sumYes').addEventListener('click', check);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      document.getElementById('sumNo').addEventListener('click', close);
    })();
  }
  overlay.addEventListener('click', function (e) { if (e.target === overlay && GG.current()) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden && GG.current()) close(); });
  window.addEventListener('pageshow', function () { GG.reload(); renderHeader(); });

  renderHeader();
  GGInstall.banner(document.getElementById('installBanner'));
  if (!GG.current()) showSetup();
})();
</script>
</body>
</html>
