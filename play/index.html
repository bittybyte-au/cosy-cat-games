<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosy Cat Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Our family's little collection of games.">
<meta name="theme-color" content="#9EDCFF">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cosy Cat Games">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: a sunny garden sky; big sticker-style game tiles sit on a grassy hill. Single bright look by design. */
:root {
  --sky: #9EDCFF;
  --sky-deep: #6CC4F7;
  --grass: #7BD389;
  --grass-deep: #4FB868;
  --ink: #2A2340;
  --cream: #FFF8EC;
  --tomato: #FF6B57;
  --sun: #FFC93C;
  --berry: #FF7EB6;
  --muted: #5E5675;
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
.sky {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(var(--sky) 0 55%, var(--sky-deep));
}
.sky svg { position: absolute; }
.sun { bottom: calc(38vh - 58px); right: 7%; width: 120px; height: 120px; }
.cloud1 { top: 44vh; left: -30px; width: 190px; animation: drift 60s linear infinite; }
.cloud2 { top: 30vh; right: -40px; width: 150px; animation: drift 80s linear infinite reverse; }
.hill { left: 0; right: 0; bottom: 0; width: 100%; height: 38vh; }
.paws { left: 0; right: 0; bottom: 0; width: 100%; height: 130px; }
@keyframes drift { from { transform: translateX(0) } to { transform: translateX(40vw) } }

.wrap {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
  min-height: 100vh; min-height: 100svh;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1;
  color: var(--cream);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
  letter-spacing: .5px;
}
.toddler-chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 14px 0 8px;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
  font: 800 1rem var(--body); color: var(--ink); cursor: pointer;
}
.toddler-chip .knob { position: relative; width: 44px; height: 26px; border-radius: 999px; background: #D8D2E4; border: 3px solid var(--ink); flex: none; }
.toddler-chip .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: left .2s ease; }
.toddler-chip[aria-pressed="true"] { background: var(--sun); }
.toddler-chip[aria-pressed="true"] .knob { background: var(--grass); }
.toddler-chip[aria-pressed="true"] .knob::after { left: 20px; }
.toddler-chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.toddler-chip:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.sum-q { margin: 0; text-align: center; font: 800 1.4rem var(--body); }
#sumIn { width: 100%; min-height: 60px; border: 3px solid var(--ink); border-radius: 18px; padding: 0 16px; font: 800 1.4rem var(--body); color: var(--ink); background: #fff; text-align: center; }
body.toddler .tiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
body.toddler .tile h2 { font-size: 2.2rem; }
h1 .home-link { color: inherit; text-decoration: none; }
.player-chip { position: relative; }
.new-dot { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--tomato); border: 3px solid var(--ink); }
.av-prev { display: grid; place-items: center; margin-top: -6px; }
.av-prev svg { width: 120px; height: 120px; }
.av-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.av-tabs button { min-height: 48px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font: 800 .95rem var(--body); color: var(--ink); cursor: pointer; padding: 0 4px; }
.av-tabs button[aria-selected="true"] { background: var(--sun); box-shadow: 0 3px 0 var(--ink); }
.av-pane { min-height: 220px; display: flex; flex-direction: column; gap: 14px; }
.av-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.av-opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 3px solid transparent; border-radius: 18px; background: #fff; cursor: pointer; font: 800 .85rem/1.15 var(--body); color: var(--ink); }
.av-opt svg { width: 64px; height: 64px; }
.av-opt[aria-pressed="true"] { border-color: var(--ink); background: #FFF1B8; }
.av-opt.locked svg { filter: grayscale(1); opacity: .45; }
.av-opt.locked .av-name { color: var(--muted); }
.av-hint { display: flex; gap: 3px; align-items: flex-start; font: 700 .75rem/1.2 var(--body); color: var(--muted); text-align: left; }
.av-hint svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }
.av-newtag { position: absolute; top: -8px; right: -4px; background: var(--tomato); color: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font: 800 .75rem/1.5 var(--body); }
.av-opt.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.av-sw { display: flex; flex-wrap: wrap; gap: 8px; }
.av-sw > button, .av-custom { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; }
.av-sw > button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 2px; }
.av-custom { position: relative; display: grid; place-items: center; background: conic-gradient(#FF6B57, #FFC93C, #7BD389, #3FA7F5, #9B7BFF, #FF7EB6, #FF6B57); font: 800 1.4rem/1 var(--body); color: #fff; text-shadow: 0 1px 2px var(--ink); }
.av-custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .av-opt.shake { animation: none; } }
.head-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.player-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px;
  padding: 6px 16px 6px 6px; min-height: 60px;
  font: 800 1.1rem var(--body); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink); cursor: pointer;
}
.player-chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.player-chip svg { width: 46px; height: 46px; flex: none; }

.hello { display: flex; align-items: center; gap: 4px; margin-block: -6px -4px; }
.mascot { width: 104px; height: auto; flex: none; animation: bob 2.6s ease-in-out infinite; }
.mascot .wave { transform-origin: 136px 146px; animation: wave 1.1s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(10deg); } to { transform: rotate(-14deg); } }
@keyframes bob { 50% { transform: translateY(-4px); } }
.greeting {
  position: relative; margin: 0; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 10px 18px;
  font: 800 1.3rem/1.2 var(--body); color: var(--ink); box-shadow: 0 4px 0 var(--ink); min-width: 0;
}
.greeting::before {
  content: ""; position: absolute; left: -15px; top: 50%; margin-top: -9px;
  border: 9px solid transparent; border-right: 14px solid var(--ink); border-left: 0;
}
.greeting::after {
  content: ""; position: absolute; left: -9px; top: 50%; margin-top: -6px;
  border: 6px solid transparent; border-right: 10px solid #fff; border-left: 0;
}
.ear { position: absolute; top: -38px; width: 60px; height: 44px; overflow: visible; pointer-events: none; }
.ear.l { left: 26px; transform: rotate(-8deg); }
.ear.r { right: 26px; transform: rotate(8deg); }
.paw { width: 18px; height: 18px; fill: currentColor; vertical-align: -3px; }
.sleepy { width: 100%; max-width: 190px; height: auto; }
.panel.whos { position: relative; margin-top: 64px; }
.peek { position: absolute; left: 50%; top: -80px; width: 132px; transform: translateX(-50%); pointer-events: none; }

.tiles { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 22px; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 8px; --tile: #FFB4A2;
  border: 4px solid var(--ink); border-radius: 30px; padding: 16px 18px 20px;
  color: var(--ink); text-decoration: none; min-height: 250px;
  box-shadow: 0 8px 0 var(--ink);
  transition: transform .15s ease, box-shadow .15s ease;
}
a.tile:hover { transform: translateY(-3px) rotate(-.6deg); box-shadow: 0 11px 0 var(--ink); }
a.tile:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
a.tile:focus-visible, .player-chip:focus-visible, button:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.tile .art { flex: 1; display: grid; place-items: center; min-height: 140px; }
.tile .art svg { width: 100%; max-width: 230px; height: auto; }
.tile h2 { margin: 0; font: 800 1.9rem/1 var(--display); }
.tile p { margin: 0; font-weight: 800; font-size: 1rem; }
.tile .badge {
  position: absolute; top: -14px; right: 16px;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 999px;
  padding: 4px 12px; font: 800 .95rem var(--body);
}
.tile[data-game] { background: var(--tile); }
.tile.coming { filter: saturate(.35); opacity: .8; box-shadow: 0 8px 0 rgba(42,35,64,.5); }
.tile.coming .badge { background: #fff; }
.tile.soon {
  background: rgba(255, 248, 236, .55); border-style: dashed; box-shadow: none; color: var(--muted);
  justify-content: center; align-items: center; text-align: center;
}
.tile.soon h2 { font-size: 1.5rem; }

.foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; text-align: center; font-weight: 800; color: var(--ink); font-size: .95rem; margin: 8px 0 0; }
.foot-note { display: inline-flex; align-items: center; gap: 8px; opacity: .75; }
.site-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding-top: 24px; }
.foot-link { color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; font-size: .95rem; text-decoration: none; padding: 10px 18px; }
.foot-link:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.foot-link:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; border-radius: 8px; }

/* Who's playing overlay */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(42, 35, 64, .55);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.panel {
  width: min(560px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 30px;
  box-shadow: 0 8px 0 var(--ink); padding: 22px; display: flex; flex-direction: column; gap: 18px;
}
.panel h2 { margin: 0; font: 800 2rem/1 var(--display); text-align: center; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; }
.person {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 12px 8px;
  font: 800 1.1rem var(--body); color: var(--ink); cursor: pointer; min-height: 130px; justify-content: center;
  word-break: break-word;
}
.person.selected { background: #FFF1B8; }
.person svg { width: 72px; height: 72px; }
.person.add { border-style: dashed; background: transparent; }
.plus { width: 64px; height: 64px; border-radius: 50%; background: var(--grass); border: 3px solid var(--ink); display: grid; place-items: center; font: 800 2.4rem/1 var(--display); color: var(--ink); }
.del {
  position: absolute; top: -10px; right: -10px; width: 40px; height: 40px; border-radius: 50%;
  border: 3px solid var(--ink); background: var(--tomato); color: #fff; font: 800 1.2rem/1 var(--body); cursor: pointer;
}
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn {
  min-height: 58px; padding: 0 24px; border-radius: 999px; border: 3px solid var(--ink);
  font: 800 1.15rem var(--body); color: var(--ink); background: var(--sun); cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.plain { background: #fff; }
.btn.go { background: var(--grass); }
.btn.warn { background: var(--tomato); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
label.lab { font-weight: 800; font-size: 1.05rem; display: block; margin-bottom: 8px; }
#nameInput {
  width: 100%; min-height: 60px; border: 3px solid var(--ink); border-radius: 18px; padding: 0 16px;
  font: 800 1.4rem var(--body); color: var(--ink); background: #fff;
}
.pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pick button { aspect-ratio: 1; border: 3px solid transparent; border-radius: 50%; background: none; padding: 2px; cursor: pointer; min-width: 44px; }
.pick button svg { width: 100%; height: 100%; }
.pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--sun); }
.swatches button { border-radius: 50%; aspect-ratio: 1; border: 3px solid var(--ink); cursor: pointer; min-width: 44px; }
.swatches button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
.note { margin: 0; text-align: center; font-weight: 700; color: var(--muted); font-size: .95rem; }
.confirm-text { margin: 0; text-align: center; font: 800 1.3rem var(--body); }

@media (prefers-reduced-motion: reduce) {
  .cloud1, .cloud2, .mascot, .mascot .wave { animation: none; }
  .tile, .btn, .player-chip { transition: none; }
}
</style>
</head>

</div>

  </header>
  <div class="hello"><svg class="mascot" viewBox="0 -8 170 188" aria-hidden="true"><path d="M30 150 Q0 140 10 110 Q16 96 28 104" fill="none" stroke="#2A2340" stroke-width="14" stroke-linecap="round"/><path d="M30 150 Q0 140 10 110 Q16 96 28 104" fill="none" stroke="#FFB26B" stroke-width="7" stroke-linecap="round"/><ellipse cx="80" cy="148" rx="50" ry="32" fill="#fff" stroke="#2A2340" stroke-width="5"/><ellipse cx="62" cy="168" rx="14" ry="9" fill="#fff" stroke="#2A2340" stroke-width="4"/><ellipse cx="98" cy="168" rx="14" ry="9" fill="#fff" stroke="#2A2340" stroke-width="4"/><path d="M30 60 L26 18 L62 38 Z" fill="#fff" stroke="#2A2340" stroke-width="5" stroke-linejoin="round"/><path d="M130 60 L134 18 L98 38 Z" fill="#FFB26B" stroke="#2A2340" stroke-width="5" stroke-linejoin="round"/><path d="M34 48 L32 28 L50 39 Z" fill="#FFB3C7"/><path d="M126 48 L128 28 L110 39 Z" fill="#FFB3C7"/><ellipse cx="80" cy="80" rx="60" ry="48" fill="#fff"/><path d="M104 38 Q132 40 139 70 Q122 64 108 60 Q100 50 104 38 Z" fill="#FFB26B"/><ellipse cx="80" cy="80" rx="60" ry="48" fill="none" stroke="#2A2340" stroke-width="5"/><path d="M52 82 Q60 71 68 82" fill="none" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><path d="M92 82 Q100 71 108 82" fill="none" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><ellipse cx="46" cy="96" rx="9" ry="5.5" fill="#FF8FAB"/><ellipse cx="114" cy="96" rx="9" ry="5.5" fill="#FF8FAB"/><path d="M72 94 Q76 100 80 94 Q84 100 88 94" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><g stroke="#2A2340" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="88" x2="38" y2="91"/><line x1="24" y1="99" x2="38" y2="98"/><line x1="138" y1="88" x2="122" y2="91"/><line x1="136" y1="99" x2="122" y2="98"/></g><g stroke="#2A2340" stroke-width="4"><circle cx="66" cy="20" r="12" fill="#fff"/><circle cx="94" cy="20" r="12" fill="#fff"/><circle cx="80" cy="13" r="14" fill="#fff"/><rect x="60" y="24" width="40" height="13" rx="4" fill="#fff"/></g><g class="wave"><path d="M118 150 Q140 140 142 116" fill="none" stroke="#2A2340" stroke-width="20" stroke-linecap="round"/><path d="M118 150 Q140 140 142 116" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><ellipse cx="144" cy="106" rx="16" ry="18" fill="#fff" stroke="#2A2340" stroke-width="4.5"/><g fill="#FFB3C7"><circle cx="144" cy="110" r="5"/><circle cx="136" cy="100" r="2.6"/><circle cx="144" cy="97" r="2.6"/><circle cx="152" cy="100" r="2.6"/></g></g></svg><p class="greeting" id="greeting"></p></div>

  <div id="installBanner" hidden></div>
  <main class="tiles" id="tiles">
    <div class="tile soon" aria-label="More games coming soon">
      <svg class="sleepy" viewBox="0 0 190 120" aria-hidden="true"><path d="M40 96 Q8 98 18 76 Q24 64 40 70" fill="none" stroke="#2A2340" stroke-width="13" stroke-linecap="round"/><path d="M40 96 Q8 98 18 76 Q24 64 40 70" fill="none" stroke="#FFB26B" stroke-width="6" stroke-linecap="round"/><ellipse cx="88" cy="86" rx="58" ry="28" fill="#fff" stroke="#2A2340" stroke-width="4.5"/><path d="M110 58 L114 34 L128 48 Z M146 50 L156 30 L160 54 Z" fill="#fff" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><path d="M146 50 L156 30 L160 54 Z" fill="#FFB26B" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><ellipse cx="136" cy="78" rx="32" ry="26" fill="#fff" stroke="#2A2340" stroke-width="4.5"/><path d="M120 78 Q125 82 130 78 M142 78 Q147 82 152 78" fill="none" stroke="#2A2340" stroke-width="3" stroke-linecap="round"/><ellipse cx="118" cy="88" rx="5" ry="3" fill="#FF8FAB"/><ellipse cx="156" cy="88" rx="5" ry="3" fill="#FF8FAB"/><path d="M132 88 Q136 91 140 88" fill="none" stroke="#2A2340" stroke-width="2.5" stroke-linecap="round"/><text x="160" y="34" font-family="Baloo 2, ui-rounded, sans-serif" font-weight="800" font-size="18" fill="#5E5675">z</text><text x="172" y="18" font-family="Baloo 2, ui-rounded, sans-serif" font-weight="800" font-size="24" fill="#5E5675">Z</text></svg>
      <h2>More games</h2>
      <p>coming soon</p>
    </div>
  </main>
  <p class="foot"><span class="foot-note"><svg class="paw" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="27" rx="10" ry="8.5"/><circle cx="9" cy="16" r="4.6"/><circle cx="16" cy="9" r="4.6"/><circle cx="24" cy="9" r="4.6"/><circle cx="31" cy="16" r="4.6"/></svg>Progress is saved on this device only.</span></p>
  <footer class="site-foot"><a class="foot-link" href="../about/index.html">About Cosy Cat Games</a><a class="foot-link" href="../faq/index.html">Questions (FAQ)</a><a class="foot-link" href="../feedback/index.html">Send feedback</a></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" id="panel"></div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/games.js"></script>
<script src="../shared/avatar.js"></script>
<script src="../shared/install.js"></script>
<script>
(function () {
  var chip = document.getElementById('playerChip');
  var greet = document.getElementById('greeting');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function renderHeader() {
    var p = GG.current();
    if (p) {
      var fresh = newItems(p);
      chip.innerHTML = GGAvatar.svg(GGAvatar.normalise(p.avatar, p.color), 46) + '<span>' + esc(p.name) + '</span>' + (fresh.length ? '<span class="new-dot" aria-label="New things to wear"></span>' : '');
      greet.textContent = fresh.length
        ? 'You earned ' + (fresh.length > 1 ? fresh.length + ' new things' : article(GGAvatar.item(fresh[0]).name + (GGAvatar.TYPES.some(function (t) { return t.id === fresh[0]; }) ? ' cat' : ''))) + '! Tap your picture to try ' + (fresh.length > 1 ? 'them' : 'it') + ' on.'
        : 'Hi ' + p.name + '! Pick a game.';
    } else {
      chip.innerHTML = '<span class="plus" style="width:46px;height:46px;font-size:1.8rem">+</span><span>Add your name</span>';
      greet.textContent = 'Pick a game.';
    }
    GGGames.all.forEach(function (g) {
      var b = document.querySelector('.tile[data-game="' + g.id + '"] .badge');
      if (!b || !g.badge) return;
      var txt = g.badge(GG.getProgress(g.save));
      b.hidden = !txt; b.textContent = txt;
    });
  }

  function open() { overlay.hidden = false; }
  function close() { overlay.hidden = true; renderHeader(); }

  /* earned avatar items the player hasn't seen yet */
  function newItems(p) { var seen = p.seen || []; return GGAvatar.unlocked(GG).filter(function (id) { return seen.indexOf(id) < 0; }); }
  function article(name) { var n = name.charAt(0).toLowerCase() + name.slice(1); return (/^[aeiou]/.test(n) ? 'an ' : 'a ') + n; }

  /* one player per device: the first visit asks for a name and builds a cat; the chip changes them later */
  var TABS = [['type', 'Cat'], ['colours', 'Colours'], ['head', 'Hat & hair'], ['face', 'Face']];
  function showSetup(tab) {
    var p = GG.current();
    var av = p ? GGAvatar.normalise(p.avatar, p.color) : GGAvatar.random();
    var got = GGAvatar.unlocked(GG);
    var fresh = p ? newItems(p) : [];
    tab = tab || (fresh.length ? (GGAvatar.TYPES.some(function (t) { return t.id === fresh[0]; }) ? 'type' : GGAvatar.FACES.some(function (t) { return t.id === fresh[0]; }) ? 'face' : 'head') : 'type');
    panel.classList.remove('whos');
    panel.innerHTML = '<div class="av-prev" id="avPrev"></div>' +
      '<h2 id="panelTitle">' + (p ? 'Your cat' : 'Hello! Make your cat') + '</h2>' +
      '<div><label class="lab" for="nameInput">Your name</label><input id="nameInput" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false"></div>' +
      '<div class="av-tabs" role="tablist">' + TABS.map(function (t) { return '<button type="button" role="tab" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div class="av-pane" id="avPane" role="tabpanel"></div>' +
      '<div class="row">' + (p ? '<button class="btn plain" type="button" id="backBtn">Cancel</button>' : '') +
      '<button class="btn go" type="button" id="saveBtn">' + (p ? 'Save' : 'Let’s play!') + '</button></div>' +
      '<p class="note">Saved on this device only. No sign-up needed.</p>';
    open();
    var input = document.getElementById('nameInput'), save = document.getElementById('saveBtn'), pane = document.getElementById('avPane');
    input.value = p ? p.name : '';
    function preview() { document.getElementById('avPrev').innerHTML = GGAvatar.svg(av, 120); }
    function opt(list, key) {
      return '<div class="av-opts">' + list.map(function (it) {
        var locked = it.earn && got.indexOf(it.id) < 0 && av[key] !== it.id;
        var trial = {}; for (var k in av) trial[k] = av[k]; trial[key] = it.id;
        return '<button type="button" class="av-opt' + (locked ? ' locked' : '') + (fresh.indexOf(it.id) >= 0 ? ' fresh' : '') + '" data-key="' + key + '" data-id="' + it.id + '" aria-pressed="' + (av[key] === it.id) + '"' +
          (locked ? ' aria-disabled="true"' : '') + ' aria-label="' + esc(it.name) + (locked ? ', locked: ' + esc(it.earn.hint) : '') + '">' +
          GGAvatar.svg(trial, 64) + '<span class="av-name">' + esc(it.name) + '</span>' +
          (locked ? '<span class="av-hint">' + LOCK + esc(it.earn.hint) + '</span>' : (fresh.indexOf(it.id) >= 0 ? '<span class="av-newtag">New!</span>' : '')) + '</button>';
      }).join('') + '</div>';
    }
    function swatches(list, key, label) {
      return '<div><span class="lab">' + label + '</span><div class="av-sw">' + list.map(function (c) {
        return '<button type="button" data-key="' + key + '" data-col="' + c + '" aria-label="' + label + ' ' + c + '" aria-pressed="' + (av[key].toLowerCase() === c.toLowerCase()) + '" style="background:' + c + '"></button>';
      }).join('') + '<label class="av-custom" title="Pick any colour"><input type="color" data-key="' + key + '" value="' + av[key] + '" aria-label="Pick any ' + label.toLowerCase() + '"><span aria-hidden="true">+</span></label></div></div>';
    }
    function draw() {
      preview();
      panel.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
      if (tab === 'type') pane.innerHTML = opt(GGAvatar.TYPES, 'type');
      else if (tab === 'head') pane.innerHTML = opt(GGAvatar.HEADS, 'head');
      else if (tab === 'face') pane.innerHTML = opt(GGAvatar.FACES, 'face');
      else pane.innerHTML = swatches(GGAvatar.CAT_COLOURS, 'color', 'Cat colour') + (av.type === 'calico' ? '<p class="note">Calico cats are always white with patches.</p>' : '') + swatches(GGAvatar.BG_COLOURS, 'bg', 'Background');
      pane.querySelectorAll('.av-opt').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.classList.contains('locked')) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
          av[b.dataset.key] = b.dataset.id; draw();
        });
      });
      pane.querySelectorAll('.av-sw > button').forEach(function (b) { b.addEventListener('click', function () { av[b.dataset.key] = b.dataset.col; draw(); }); });
      pane.querySelectorAll('input[type=color]').forEach(function (inp) {
        inp.addEventListener('input', function () { av[inp.dataset.key] = inp.value; preview(); });
        inp.addEventListener('change', function () { av[inp.dataset.key] = inp.value; draw(); });
      });
    }
    panel.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { tab = b.dataset.tab; draw(); }); });
    draw();
    function ready() { save.disabled = !input.value.trim(); }
    ready();
    input.addEventListener('input', ready);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && input.value.trim()) save.click(); });
    var back = document.getElementById('backBtn'); if (back) back.addEventListener('click', function () { markSeen(); close(); });
    function markSeen() { if (GG.current()) GG.setPlayerInfo({ seen: GGAvatar.unlocked(GG) }); }
    save.addEventListener('click', function () { GG.addPlayer(input.value.trim(), av); markSeen(); close(); });
    if (!p) setTimeout(function () { input.focus(); }, 50);
  }
  var LOCK = '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="3" fill="#5E5675"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#5E5675" stroke-width="2.6"/></svg>';

  chip.addEventListener('click', function () { showSetup(); });
  var EAR = '<svg class="ear l" viewBox="0 0 60 44" aria-hidden="true"><path d="M2 48 L20 6 Q25 0 31 6 L58 48 Z" fill="var(--tile)"/><path d="M2 46 L20 6 Q25 0 31 6 L58 46" fill="none" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><path d="M16 40 L25 16 L42 40 Z" fill="#FF8FAB" opacity=".75"/></svg>';
  /* Toddler mode shows only toddler games. The switch stays hidden until there are 3 toddler games to play. */
  function toddlerGames() { return GGGames.visible({ toddler: true }).filter(GGGames.playable); }
  function toddlerReady() { return toddlerGames().length >= 3; }
  function toddlerOn() { return toddlerReady() && !!GG.getSetting('toddler', false); }
  function renderTiles() {
    var box = document.getElementById('tiles'), sleepy = box.querySelector('.tile.soon');
    box.querySelectorAll('.tile[data-game]').forEach(function (t) { t.remove(); });
    var tod = toddlerOn();
    document.body.classList.toggle('toddler', tod);
    sleepy.hidden = tod;
    var tb = document.getElementById('toddlerBtn');
    tb.hidden = !toddlerReady();
    tb.setAttribute('aria-pressed', String(tod));
    document.getElementById('toddlerLabel').textContent = tod ? 'Toddler mode on' : 'Toddler mode';
    GGGames.visible(tod ? { toddler: true } : {}).forEach(function (g) {
      var ok = GGGames.playable(g);
      var t = document.createElement(ok ? 'a' : 'div');
      t.className = 'tile' + (ok ? '' : ' coming');
      t.dataset.game = g.id;
      t.style.setProperty('--tile', g.colour);
      if (ok) t.href = '../games/' + g.id + '/index.html';
      else t.setAttribute('aria-label', g.name + ', coming soon');
      t.innerHTML = EAR + EAR.replace('ear l', 'ear r') +
        '<span class="badge"' + (ok ? ' hidden' : '') + '>' + (ok ? '' : 'Coming soon') + '</span>' +
        '<div class="art" aria-hidden="true">' + g.art + '</div><h2>' + esc(g.name) + '</h2><p>' + esc(g.blurb) + '</p>';
      if (ok) t.addEventListener('click', function (e) {
        if (!GG.current()) { e.preventDefault(); showSetup(); }
      });
      box.insertBefore(t, sleepy);
    });
  }
  renderTiles();

  document.getElementById('toddlerBtn').addEventListener('click', function () {
    panel.classList.remove('whos');
    if (!toddlerOn()) {
      panel.innerHTML = '<h2 id="panelTitle">Turn on toddler mode?</h2>' +
        '<p class="confirm-text">Only the simplest games will show, made for little ones under 5.</p>' +
        '<p class="note">To turn it off again, a grown-up answers a quick sum.</p>' +
        '<div class="row"><button class="btn plain" type="button" id="todNo">Not now</button><button class="btn go" type="button" id="todYes">Turn on</button></div>';
      open();
      document.getElementById('todNo').addEventListener('click', close);
      document.getElementById('todYes').addEventListener('click', function () { GG.setSetting('toddler', true); close(); renderTiles(); });
      return;
    }
    (function ask() {
      var x = 4 + Math.floor(Math.random() * 6), y = 3 + Math.floor(Math.random() * 7);
      panel.innerHTML = '<h2 id="panelTitle">Turn off toddler mode?</h2>' +
        '<p class="sum-q">Grown-ups: what is ' + x + ' + ' + y + '?</p>' +
        '<input id="sumIn" inputmode="numeric" autocomplete="off" aria-label="Answer">' +
        '<p class="note" id="sumMsg"></p>' +
        '<div class="row"><button class="btn plain" type="button" id="sumNo">Keep it on</button><button class="btn go" type="button" id="sumYes">Turn off</button></div>';
      open();
      var input = document.getElementById('sumIn');
      setTimeout(function () { input.focus(); }, 50);
      function check() {
        if (parseInt(input.value, 10) === x + y) { GG.setSetting('toddler', false); close(); renderTiles(); }
        else { document.getElementById('sumMsg').textContent = 'Not quite. Try this one.'; setTimeout(ask, 900); }
      }
      document.getElementById('sumYes').addEventListener('click', check);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      document.getElementById('sumNo').addEventListener('click', close);
    })();
  });
  overlay.addEventListener('click', function (e) { if (e.target === overlay && GG.current()) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden && GG.current()) close(); });
  window.addEventListener('pageshow', function () { GG.reload(); renderHeader(); });

  renderHeader();
  GGInstall.banner(document.getElementById('installBanner'));
  if (!GG.current()) showSetup();
})();
</script>
