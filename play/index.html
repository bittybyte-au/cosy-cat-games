<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosy Cat Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Our family's little collection of games.">
<meta name="theme-color" content="#9EDCFF">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cosy Cat Games">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../shared/site.css">
<style>
/* Games home layout. Shared look: shared/site.css. A sunny garden sky; game tiles sit on a grassy hill. */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(var(--sky) 0 55%, var(--sky-deep)); }
.sky > * { position: absolute; }
.sun { bottom: calc(38vh - 58px); right: 7%; width: 120px; }
.cloud1 { top: 44vh; left: -30px; width: 190px; animation: drift 60s linear infinite; }
.cloud2 { top: 30vh; right: -40px; width: 150px; animation: drift 80s linear infinite reverse; }
.hill { left: 0; right: 0; bottom: 0; width: 100%; height: 38vh; }
.paws { left: 0; right: 0; bottom: 0; width: 100%; height: 130px; }
@keyframes drift { from { transform: translateX(0) } to { transform: translateX(40vw) } }

.wrap {
  position: relative; z-index: 1;
  padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px; min-height: 100vh; min-height: 100svh;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .5px; }
h1 a { color: inherit; text-decoration: none; }
.head-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* the player chip and the toddler switch */
.player-chip { position: relative; padding: 6px 16px 6px 6px; min-height: 60px; font-size: 1.1rem; }
.player-chip svg { width: 46px; height: 46px; flex: none; }
.plus { width: 46px; height: 46px; border-radius: 50%; background: var(--grass); border: 3px solid var(--ink); display: grid; place-items: center; font: 800 1.8rem/1 var(--display); }
.new-dot { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--tomato); border: 3px solid var(--ink); }
.toddler-chip { gap: 8px; padding: 0 14px 0 8px; }
.toddler-chip .knob { position: relative; width: 44px; height: 26px; border-radius: 999px; background: #D8D2E4; border: 3px solid var(--ink); flex: none; }
.toddler-chip .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: left .2s ease; }
.toddler-chip[aria-pressed="true"] { background: var(--sun); }
.toddler-chip[aria-pressed="true"] .knob { background: var(--grass); }
.toddler-chip[aria-pressed="true"] .knob::after { left: 20px; }
.sum-q { text-align: center; font: 800 1.4rem var(--body); }
#sumIn { text-align: center; }
.confirm-text { text-align: center; font: 800 1.3rem var(--body); }

/* the chef cat says hello */
.hello { display: flex; align-items: center; gap: 4px; margin-block: -6px -4px; }
.mascot { width: 96px; flex: none; animation: bob 2.6s ease-in-out infinite; }
.greeting {
  position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 10px 18px;
  font: 800 1.3rem/1.2 var(--body); box-shadow: 0 4px 0 var(--ink); min-width: 0;
}
.greeting::before { content: ""; position: absolute; left: -15px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right: 14px solid var(--ink); border-left: 0; }
.greeting::after { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right: 10px solid #fff; border-left: 0; }

/* game tiles */
.tiles { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 22px; }
.tiles .tile { min-height: 250px; }
.tiles .art { min-height: 140px; }
body.toddler .tiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
body.toddler .tile h2 { font-size: 2.2rem; }

/* avatar builder */
.av-prev { width: 120px; margin: -6px auto 0; }
.av-prev svg { width: 120px; height: 120px; }
.av-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.av-tabs button { min-height: 48px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font: 800 .95rem var(--body); color: var(--ink); cursor: pointer; padding: 0 4px; }
.av-tabs button[aria-selected="true"] { background: var(--sun); box-shadow: 0 3px 0 var(--ink); }
.av-pane { min-height: 220px; display: flex; flex-direction: column; gap: 14px; }
.av-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.av-opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 3px solid transparent; border-radius: 18px; background: #fff; cursor: pointer; font: 800 .85rem/1.15 var(--body); color: var(--ink); }
.av-opt svg { width: 64px; height: 64px; }
.av-opt[aria-pressed="true"] { border-color: var(--ink); background: var(--pale-sun); }
.av-opt.locked svg { filter: grayscale(1); opacity: .45; }
.av-opt.locked .av-name { color: var(--muted); }
.av-hint { display: flex; gap: 3px; align-items: flex-start; font: 700 .75rem/1.2 var(--body); color: var(--muted); text-align: left; }
.av-hint svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }
.av-newtag { position: absolute; top: -8px; right: -4px; background: var(--tomato); color: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font: 800 .75rem/1.5 var(--body); }
.av-opt.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.av-sw { display: flex; flex-wrap: wrap; gap: 8px; }
.av-sw > button, .av-custom { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; }
.av-sw > button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 2px; }
.av-custom { position: relative; display: grid; place-items: center; background: conic-gradient(#FF6B57, #FFC93C, #7BD389, #3FA7F5, #9B7BFF, #FF7EB6, #FF6B57); font: 800 1.4rem/1 var(--body); color: #fff; text-shadow: 0 1px 2px var(--ink); }
.av-custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

/* footer */
.foot { display: flex; justify-content: center; text-align: center; font-size: .95rem; margin: 8px 0 0; }
.foot-note { display: inline-flex; align-items: center; gap: 8px; opacity: .75; }
.paw { width: 18px; height: 18px; fill: currentColor; vertical-align: -3px; }
.site-foot { margin-top: auto; padding-top: 24px; }

@media (prefers-reduced-motion: reduce) {
  .cloud1, .cloud2, .mascot, .av-opt.shake { animation: none; }
  .toddler-chip .knob::after { transition: none; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <span class="sun" data-cat='{"preset":"sun","rays":true}'></span>
  <svg class="cloud1" viewBox="0 -6 200 86"><g data-cat-ears='{"x":98,"y":30,"k":0.62}'></g><path d="M30 70 Q5 70 10 50 Q12 32 38 36 Q45 10 80 16 Q100 0 125 18 Q160 12 165 40 Q195 42 188 62 Q185 72 165 70 Z" fill="#fff" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><path d="M92 46 Q96 50 100 46 Q104 50 108 46" fill="none" stroke="#2A2340" stroke-width="3" stroke-linecap="round"/><circle cx="88" cy="38" r="3" fill="#2A2340"/><circle cx="112" cy="38" r="3" fill="#2A2340"/></svg>
  <svg class="cloud2" viewBox="0 -6 200 86"><g data-cat-ears='{"x":98,"y":30,"k":0.62}'></g><path d="M30 70 Q5 70 10 50 Q12 32 38 36 Q45 10 80 16 Q100 0 125 18 Q160 12 165 40 Q195 42 188 62 Q185 72 165 70 Z" fill="#fff" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><path d="M92 46 Q96 50 100 46 Q104 50 108 46" fill="none" stroke="#2A2340" stroke-width="3" stroke-linecap="round"/><circle cx="88" cy="38" r="3" fill="#2A2340"/><circle cx="112" cy="38" r="3" fill="#2A2340"/></svg>
  <svg class="hill" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 120 Q250 20 520 110 Q760 190 1000 80 L1000 300 L0 300 Z" fill="#4FB868"/><path d="M0 190 Q300 90 600 170 Q820 230 1000 160 L1000 300 L0 300 Z" fill="#7BD389"/></svg>
  <svg class="paws" aria-hidden="true"><defs><pattern id="pawTrail" width="180" height="130" patternUnits="userSpaceOnUse"><g fill="#3E9E57"><g transform="translate(40 88) rotate(80) scale(1.35)"><ellipse cx="0" cy="8" rx="10" ry="8.5"/><circle cx="-11" cy="-3" r="4.6"/><circle cx="-4" cy="-10" r="4.6"/><circle cx="4" cy="-10" r="4.6"/><circle cx="11" cy="-3" r="4.6"/></g><g transform="translate(130 46) rotate(95) scale(1.35)"><ellipse cx="0" cy="8" rx="10" ry="8.5"/><circle cx="-11" cy="-3" r="4.6"/><circle cx="-4" cy="-10" r="4.6"/><circle cx="4" cy="-10" r="4.6"/><circle cx="11" cy="-3" r="4.6"/></g></g></pattern></defs><rect width="100%" height="100%" fill="url(#pawTrail)" opacity=".5"/></svg>
</div>

<div class="wrap">
  <header>
    <h1 class="sticker-title"><a href="../index.html">Cosy Cat Games</a></h1>
    <div class="head-btns">
      <button class="chip toddler-chip" id="toddlerBtn" type="button" aria-pressed="false" hidden><span class="knob" aria-hidden="true"></span><span id="toddlerLabel">Toddler mode</span></button>
      <button class="chip player-chip" id="playerChip" type="button" aria-label="Change your name or animal"></button>
    </div>
  </header>
  <div class="hello"><span class="mascot" data-cat='{"preset":"chef","pose":"wave"}'></span><p class="greeting" id="greeting"></p></div>

  <div id="installBanner" hidden></div>
  <main class="tiles" id="tiles">
    <div class="tile more" aria-label="More games coming soon">
      <span class="sleepy" data-cat='{"preset":"chef","hat":"none","pose":"lie","face":"sleep","zzz":true}'></span>
      <h2>More games</h2>
      <p>coming soon</p>
    </div>
  </main>
  <p class="foot"><span class="foot-note"><svg class="paw" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="27" rx="10" ry="8.5"/><circle cx="9" cy="16" r="4.6"/><circle cx="16" cy="9" r="4.6"/><circle cx="24" cy="9" r="4.6"/><circle cx="31" cy="16" r="4.6"/></svg>Progress is saved on this device only.</span></p>
  <footer class="site-foot pills"><a class="pill" href="../about/index.html">About Cosy Cat Games</a><a class="pill" href="../faq/index.html">Questions (FAQ)</a><a class="pill" href="../feedback/index.html">Send feedback</a></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" id="panel"></div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/cat.js"></script>
<script src="../shared/games.js"></script>
<script src="../shared/avatar.js"></script>
<script src="../shared/install.js"></script>
<script>
(function () {
  var chip = document.getElementById('playerChip');
  var greet = document.getElementById('greeting');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function renderHeader() {
    var p = GG.current();
    if (p) {
      var fresh = newItems(p);
      chip.innerHTML = GGAvatar.svg(GGAvatar.normalise(p.avatar, p.color), 46) + '<span>' + esc(p.name) + '</span>' + (fresh.length ? '<span class="new-dot" aria-label="New things to wear"></span>' : '');
      greet.textContent = fresh.length
        ? 'You earned ' + (fresh.length > 1 ? fresh.length + ' new things' : article(GGAvatar.item(fresh[0]).name + (GGAvatar.TYPES.some(function (t) { return t.id === fresh[0]; }) ? ' cat' : ''))) + '! Tap your picture to try ' + (fresh.length > 1 ? 'them' : 'it') + ' on.'
        : 'Hi ' + p.name + '! Pick a game.';
    } else {
      chip.innerHTML = '<span class="plus">+</span><span>Add your name</span>';
      greet.textContent = 'Pick a game.';
    }
    GGGames.all.forEach(function (g) {
      var b = document.querySelector('.tile[data-game="' + g.id + '"] .badge');
      if (!b || !g.badge) return;
      var txt = g.badge(GG.getProgress(g.save));
      b.hidden = !txt; b.textContent = txt;
    });
  }

  function open() { overlay.hidden = false; }
  function close() { overlay.hidden = true; renderHeader(); }

  /* earned avatar items the player hasn't seen yet */
  function newItems(p) { var seen = p.seen || []; return GGAvatar.unlocked(GG).filter(function (id) { return seen.indexOf(id) < 0; }); }
  function article(name) { var n = name.charAt(0).toLowerCase() + name.slice(1); return (/^[aeiou]/.test(n) ? 'an ' : 'a ') + n; }

  /* one player per device: the first visit asks for a name and builds a cat; the chip changes them later */
  var TABS = [['type', 'Cat'], ['colours', 'Colours'], ['head', 'Hat & hair'], ['face', 'Face']];
  function showSetup(tab) {
    var p = GG.current();
    var av = p ? GGAvatar.normalise(p.avatar, p.color) : GGAvatar.random();
    var got = GGAvatar.unlocked(GG);
    var fresh = p ? newItems(p) : [];
    tab = tab || (fresh.length ? (GGAvatar.TYPES.some(function (t) { return t.id === fresh[0]; }) ? 'type' : GGAvatar.FACES.some(function (t) { return t.id === fresh[0]; }) ? 'face' : 'head') : 'type');
    panel.innerHTML = '<div class="av-prev" id="avPrev"></div>' +
      '<h2 id="panelTitle">' + (p ? 'Your cat' : 'Hello! Make your cat') + '</h2>' +
      '<div><label class="field-label" for="nameInput">Your name</label><input class="field big" id="nameInput" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false"></div>' +
      '<div class="av-tabs" role="tablist">' + TABS.map(function (t) { return '<button type="button" role="tab" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div class="av-pane" id="avPane" role="tabpanel"></div>' +
      '<div class="row">' + (p ? '<button class="btn plain" type="button" id="backBtn">Cancel</button>' : '') +
      '<button class="btn go" type="button" id="saveBtn">' + (p ? 'Save' : 'Let’s play!') + '</button></div>' +
      '<p class="note">Saved on this device only. No sign-up needed.</p>';
    open();
    var input = document.getElementById('nameInput'), save = document.getElementById('saveBtn'), pane = document.getElementById('avPane');
    input.value = p ? p.name : '';
    function preview() { document.getElementById('avPrev').innerHTML = GGAvatar.svg(av, 120); }
    function opt(list, key) {
      return '<div class="av-opts">' + list.map(function (it) {
        var locked = it.earn && got.indexOf(it.id) < 0 && av[key] !== it.id;
        var trial = {}; for (var k in av) trial[k] = av[k]; trial[key] = it.id;
        return '<button type="button" class="av-opt' + (locked ? ' locked' : '') + (fresh.indexOf(it.id) >= 0 ? ' fresh' : '') + '" data-key="' + key + '" data-id="' + it.id + '" aria-pressed="' + (av[key] === it.id) + '"' +
          (locked ? ' aria-disabled="true"' : '') + ' aria-label="' + esc(it.name) + (locked ? ', locked: ' + esc(it.earn.hint) : '') + '">' +
          GGAvatar.svg(trial, 64) + '<span class="av-name">' + esc(it.name) + '</span>' +
          (locked ? '<span class="av-hint">' + LOCK + esc(it.earn.hint) + '</span>' : (fresh.indexOf(it.id) >= 0 ? '<span class="av-newtag">New!</span>' : '')) + '</button>';
      }).join('') + '</div>';
    }
    function swatches(list, key, label) {
      return '<div><span class="field-label">' + label + '</span><div class="av-sw">' + list.map(function (c) {
        return '<button type="button" data-key="' + key + '" data-col="' + c + '" aria-label="' + label + ' ' + c + '" aria-pressed="' + (av[key].toLowerCase() === c.toLowerCase()) + '" style="background:' + c + '"></button>';
      }).join('') + '<label class="av-custom" title="Pick any colour"><input type="color" data-key="' + key + '" value="' + av[key] + '" aria-label="Pick any ' + label.toLowerCase() + '"><span aria-hidden="true">+</span></label></div></div>';
    }
    function draw() {
      preview();
      panel.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
      if (tab === 'type') pane.innerHTML = opt(GGAvatar.TYPES, 'type');
      else if (tab === 'head') pane.innerHTML = opt(GGAvatar.HEADS, 'head');
      else if (tab === 'face') pane.innerHTML = opt(GGAvatar.FACES, 'face');
      else pane.innerHTML = swatches(GGAvatar.CAT_COLOURS, 'color', 'Cat colour') + (av.type === 'calico' ? '<p class="note">Calico cats are always white with patches.</p>' : '') + swatches(GGAvatar.BG_COLOURS, 'bg', 'Background');
      pane.querySelectorAll('.av-opt').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.classList.contains('locked')) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
          av[b.dataset.key] = b.dataset.id; draw();
        });
      });
      pane.querySelectorAll('.av-sw > button').forEach(function (b) { b.addEventListener('click', function () { av[b.dataset.key] = b.dataset.col; draw(); }); });
      pane.querySelectorAll('input[type=color]').forEach(function (inp) {
        inp.addEventListener('input', function () { av[inp.dataset.key] = inp.value; preview(); });
        inp.addEventListener('change', function () { av[inp.dataset.key] = inp.value; draw(); });
      });
    }
    panel.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { tab = b.dataset.tab; draw(); }); });
    draw();
    function ready() { save.disabled = !input.value.trim(); }
    ready();
    input.addEventListener('input', ready);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && input.value.trim()) save.click(); });
    var back = document.getElementById('backBtn'); if (back) back.addEventListener('click', function () { markSeen(); close(); });
    function markSeen() { if (GG.current()) GG.setPlayerInfo({ seen: GGAvatar.unlocked(GG) }); }
    save.addEventListener('click', function () { GG.addPlayer(input.value.trim(), av); markSeen(); close(); });
    if (!p) setTimeout(function () { input.focus(); }, 50);
  }
  var LOCK = '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="3" fill="#5E5675"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#5E5675" stroke-width="2.6"/></svg>';

  chip.addEventListener('click', function () { showSetup(); });
  var EAR_L = GGCat.earSVG(-1, 'ear l'), EAR_R = GGCat.earSVG(1, 'ear r');
  /* Toddler mode shows only toddler games. The switch stays hidden until there are 3 toddler games to play. */
  function toddlerGames() { return GGGames.visible({ toddler: true }).filter(GGGames.playable); }
  function toddlerReady() { return toddlerGames().length >= 3; }
  function toddlerOn() { return toddlerReady() && !!GG.getSetting('toddler', false); }
  function renderTiles() {
    var box = document.getElementById('tiles'), sleepy = box.querySelector('.tile.more');
    box.querySelectorAll('.tile[data-game]').forEach(function (t) { t.remove(); });
    var tod = toddlerOn();
    document.body.classList.toggle('toddler', tod);
    sleepy.hidden = tod;
    var tb = document.getElementById('toddlerBtn');
    tb.hidden = !toddlerReady();
    tb.setAttribute('aria-pressed', String(tod));
    document.getElementById('toddlerLabel').textContent = tod ? 'Toddler mode on' : 'Toddler mode';
    GGGames.visible(tod ? { toddler: true } : {}).forEach(function (g) {
      var ok = GGGames.playable(g);
      var t = document.createElement(ok ? 'a' : 'div');
      t.className = 'tile' + (ok ? '' : ' coming');
      t.dataset.game = g.id;
      t.style.setProperty('--tile', g.colour);
      if (ok) t.href = '../games/' + g.id + '/index.html';
      else t.setAttribute('aria-label', g.name + ', coming soon');
      t.innerHTML = EAR_L + EAR_R +
        '<span class="badge"' + (ok ? ' hidden' : '') + '>' + (ok ? '' : 'Coming soon') + '</span>' +
        '<div class="art" aria-hidden="true">' + g.art + '</div><h2>' + esc(g.name) + '</h2><p>' + esc(g.blurb) + '</p>';
      if (ok) t.addEventListener('click', function (e) {
        if (!GG.current()) { e.preventDefault(); showSetup(); }
      });
      box.insertBefore(t, sleepy);
    });
  }
  renderTiles();

  document.getElementById('toddlerBtn').addEventListener('click', function () {
    if (!toddlerOn()) {
      panel.innerHTML = '<h2 id="panelTitle">Turn on toddler mode?</h2>' +
        '<p class="confirm-text">Only the simplest games will show, made for little ones under 5.</p>' +
        '<p class="note">To turn it off again, a grown-up answers a quick sum.</p>' +
        '<div class="row"><button class="btn plain" type="button" id="todNo">Not now</button><button class="btn go" type="button" id="todYes">Turn on</button></div>';
      open();
      document.getElementById('todNo').addEventListener('click', close);
      document.getElementById('todYes').addEventListener('click', function () { GG.setSetting('toddler', true); close(); renderTiles(); });
      return;
    }
    (function ask() {
      var x = 4 + Math.floor(Math.random() * 6), y = 3 + Math.floor(Math.random() * 7);
      panel.innerHTML = '<h2 id="panelTitle">Turn off toddler mode?</h2>' +
        '<p class="sum-q">Grown-ups: what is ' + x + ' + ' + y + '?</p>' +
        '<input class="field big" id="sumIn" inputmode="numeric" autocomplete="off" aria-label="Answer">' +
        '<p class="note" id="sumMsg"></p>' +
        '<div class="row"><button class="btn plain" type="button" id="sumNo">Keep it on</button><button class="btn go" type="button" id="sumYes">Turn off</button></div>';
      open();
      var input = document.getElementById('sumIn');
      setTimeout(function () { input.focus(); }, 50);
      function check() {
        if (parseInt(input.value, 10) === x + y) { GG.setSetting('toddler', false); close(); renderTiles(); }
        else { document.getElementById('sumMsg').textContent = 'Not quite. Try this one.'; setTimeout(ask, 900); }
      }
      document.getElementById('sumYes').addEventListener('click', check);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      document.getElementById('sumNo').addEventListener('click', close);
    })();
  });
  overlay.addEventListener('click', function (e) { if (e.target === overlay && GG.current()) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden && GG.current()) close(); });
  window.addEventListener('pageshow', function () { GG.reload(); renderHeader(); });

  renderHeader();
  GGInstall.banner(document.getElementById('installBanner'));
  if (!GG.current()) showSetup();
})();
</script>
</body>
</html>
