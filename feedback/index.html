<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send feedback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tell us about a bug, an idea or a game you would love.">
<meta name="theme-color" content="#9EDCFF">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: same sunny sky as the home page; one readable cream card with short sections. Single bright look by design. */
:root {
  --sky: #9EDCFF;
  --grass: #7BD389;
  --ink: #2A2340;
  --cream: #FFF8EC;
  --sun: #FFC93C;
  --muted: #5E5675;
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: linear-gradient(var(--sky) 0 60%, #BFE8FF) fixed; color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.55;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
  display: flex; flex-direction: column; gap: 18px;
}
.back {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 18px;
  border: 3px solid var(--ink); border-radius: 999px; background: var(--cream); color: var(--ink);
  font: 800 1rem var(--body); text-decoration: none; box-shadow: 0 4px 0 var(--ink);
}
.back:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.back:focus-visible, a:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.hero { display: flex; align-items: center; gap: 12px; }
.hero svg { width: 96px; height: auto; flex: none; }
h1 {
  margin: 0; font: 800 clamp(2rem, 7vw, 3rem)/1.05 var(--display); color: var(--cream);
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); text-wrap: balance;
}
.card {
  background: var(--cream); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 22px;
}
section { display: flex; flex-direction: column; gap: 6px; }
h2 { margin: 0; font: 800 1.5rem/1.15 var(--display); }
p { margin: 0; max-width: 62ch; }
ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.promise { list-style: none; padding: 0; display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; }
.promise li {
  background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 800;
}
.lead { font-size: 1.1rem; font-weight: 800; }
.small { color: var(--muted); font-size: .95rem; }
.qa { font-weight: 800; color: var(--muted); }
form { display: flex; flex-direction: column; gap: 16px; }
label { font-weight: 800; display: block; margin-bottom: 6px; }
.hint { font-weight: 700; color: var(--muted); font-size: .95rem; }
input[type=text], input[type=email], textarea, select {
  width: 100%; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; background: #fff; color: var(--ink);
  font: 700 1.05rem/1.4 var(--body);
}
textarea { min-height: 150px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.send { align-self: flex-start; min-height: 58px; padding: 0 28px; border-radius: 999px; border: 3px solid var(--ink); background: var(--grass); color: var(--ink); font: 800 1.15rem var(--body); box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.send:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.send:disabled { opacity: .5; cursor: default; }
.send:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.msg { margin: 0; font-weight: 800; }
.msg.ok { color: #2E7D46; } .msg.bad { color: #C0392B; }
.foot-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.foot-links a { color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; text-decoration: none; padding: 10px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../play/index.html">
    <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M20 6 L10 16 L20 26" fill="none" stroke="#2A2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to games
  </a>

  <div class="hero">
    <svg viewBox="0 -8 170 144" aria-hidden="true"><path d="M30 60 L26 18 L62 38 Z" fill="#fff" stroke="#2A2340" stroke-width="5" stroke-linejoin="round"/><path d="M130 60 L134 18 L98 38 Z" fill="#FFB26B" stroke="#2A2340" stroke-width="5" stroke-linejoin="round"/><path d="M34 48 L32 28 L50 39 Z" fill="#FFB3C7"/><path d="M126 48 L128 28 L110 39 Z" fill="#FFB3C7"/><ellipse cx="80" cy="80" rx="60" ry="48" fill="#fff"/><path d="M104 38 Q132 40 139 70 Q122 64 108 60 Q100 50 104 38 Z" fill="#FFB26B"/><ellipse cx="80" cy="80" rx="60" ry="48" fill="none" stroke="#2A2340" stroke-width="5"/><path d="M52 82 Q60 71 68 82" fill="none" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><path d="M92 82 Q100 71 108 82" fill="none" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><ellipse cx="46" cy="94" rx="9" ry="5.5" fill="#FF8FAB"/><ellipse cx="114" cy="94" rx="9" ry="5.5" fill="#FF8FAB"/><path d="M72 92 Q76 98 80 92 Q84 98 88 92" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><g stroke="#2A2340" stroke-width="4"><circle cx="66" cy="20" r="12" fill="#fff"/><circle cx="94" cy="20" r="12" fill="#fff"/><circle cx="80" cy="13" r="14" fill="#fff"/><rect x="60" y="24" width="40" height="13" rx="4" fill="#fff"/></g></svg>
    <h1>Send feedback</h1>
  </div>

  <main class="card">
    <p class="lead">Found a bug, got an idea, or know a game your kids would love? Tell me here.</p>
    <form id="fb" novalidate>
      <div>
        <label for="kind">What is it about?</label>
        <select id="kind" name="topic">
          <option>Something isn’t working</option>
          <option>An idea or a new game</option>
          <option>Something we love</option>
          <option>Something else</option>
        </select>
      </div>
      <div>
        <label for="message">Your message</label>
        <textarea id="message" name="message" required maxlength="4000" placeholder="Which game, what happened, and on what device (for example, iPad)."></textarea>
      </div>
      <div>
        <label for="email">Your email <span class="hint">(optional, only if you’d like a reply)</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="200">
      </div>
      <div class="trap" aria-hidden="true"><label for="botcheck">Leave this empty</label><input id="botcheck" name="botcheck" type="checkbox" tabindex="-1"></div>
      <p class="hint">Please don’t include your children’s full names. Messages go to my inbox through Web3Forms and aren’t shared with anyone else.</p>
      <button class="send" type="submit" id="sendBtn">Send feedback</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
  <nav class="foot-links"><a href="../faq/index.html">Questions (FAQ)</a><a href="../about/index.html">Our story</a></nav>
</div>
<script src="../shared/store.js"></script>
<script>
(function () {
  /* Web3Forms access key: paste it here (it is safe to be public; it only lets people send to your inbox). */
  var ACCESS_KEY = 'PASTE-WEB3FORMS-ACCESS-KEY-HERE';

  var form = document.getElementById('fb'), btn = document.getElementById('sendBtn'), msg = document.getElementById('msg');
  var ready = /^[0-9a-f-]{36}$/i.test(ACCESS_KEY);
  if (!ready) { btn.disabled = true; msg.textContent = 'The feedback form is nearly ready. Please check back soon.'; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!ready) return;
    var text = form.message.value.trim();
    if (!text) { msg.className = 'msg bad'; msg.textContent = 'Please write a message first.'; form.message.focus(); return; }
    if (form.botcheck.checked) return;
    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
    var body = {
      access_key: ACCESS_KEY,
      subject: 'Cosy Cat Games feedback: ' + form.topic.value,
      from_name: 'Cosy Cat Games',
      topic: form.topic.value,
      message: text,
      botcheck: false
    };
    var email = form.email.value.trim();
    if (email) { body.email = email; body.replyto = email; }
    fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.success) { form.reset(); msg.className = 'msg ok'; msg.textContent = 'Thank you! Your message is on its way.'; }
        else throw new Error('not sent');
      })
      .catch(function () { msg.className = 'msg bad'; msg.textContent = 'That didn’t send. Check you’re online and try again.'; })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
