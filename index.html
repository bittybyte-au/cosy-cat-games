<style>
/* Layout: a sunny garden sky; big sticker-style game tiles sit on a grassy hill. Single bright look by design. */
:root {
  --sky: #9EDCFF;
  --sky-deep: #6CC4F7;
  --grass: #7BD389;
  --grass-deep: #4FB868;
  --ink: #2A2340;
  --cream: #FFF8EC;
  --tomato: #FF6B57;
  --sun: #FFC93C;
  --berry: #FF7EB6;
  --muted: #5E5675;
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
.sky {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(var(--sky) 0 55%, var(--sky-deep));
}
.sky svg { position: absolute; }
.sun { bottom: calc(38vh - 58px); right: 7%; width: 120px; height: 120px; }
.cloud1 { top: 44vh; left: -30px; width: 190px; animation: drift 60s linear infinite; }
.cloud2 { top: 30vh; right: -40px; width: 150px; animation: drift 80s linear infinite reverse; }
.hill { left: 0; right: 0; bottom: 0; width: 100%; height: 38vh; }
.paws { left: 0; right: 0; bottom: 0; width: 100%; height: 130px; }
@keyframes drift { from { transform: translateX(0) } to { transform: translateX(40vw) } }

.wrap {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
  min-height: 100vh; min-height: 100svh;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1;
  color: var(--cream);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
  letter-spacing: .5px;
}
.player-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px;
  padding: 6px 16px 6px 6px; min-height: 60px;
  font: 800 1.1rem var(--body); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink); cursor: pointer;
}
.player-chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.player-chip svg { width: 46px; height: 46px; flex: none; }

.hello { display: flex; align-items: center; gap: 4px; margin-block: -6px -4px; }
.mascot { width: 104px; height: auto; flex: none; animation: bob 2.6s ease-in-out infinite; }
.mascot .wave { transform-origin: 136px 146px; animation: wave 1.1s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(10deg); } to { transform: rotate(-14deg); } }
@keyframes bob { 50% { transform: translateY(-4px); } }
.greeting {
  position: relative; margin: 0; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 10px 18px;
  font: 800 1.3rem/1.2 var(--body); color: var(--ink); box-shadow: 0 4px 0 var(--ink); min-width: 0;
}
.greeting::before {
  content: ""; position: absolute; left: -15px; top: 50%; margin-top: -9px;
  border: 9px solid transparent; border-right: 14px solid var(--ink); border-left: 0;
}
.greeting::after {
  content: ""; position: absolute; left: -9px; top: 50%; margin-top: -6px;
  border: 6px solid transparent; border-right: 10px solid #fff; border-left: 0;
}
.ear { position: absolute; top: -38px; width: 60px; height: 44px; overflow: visible; pointer-events: none; }
.ear.l { left: 26px; transform: rotate(-8deg); }
.ear.r { right: 26px; transform: rotate(8deg); }
.paw { width: 18px; height: 18px; fill: currentColor; vertical-align: -3px; }
.sleepy { width: 100%; max-width: 190px; height: auto; }
.panel.whos { position: relative; margin-top: 64px; }
.peek { position: absolute; left: 50%; top: -80px; width: 132px; transform: translateX(-50%); pointer-events: none; }

.tiles { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 22px; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 8px; --tile: #FFB4A2;
  border: 4px solid var(--ink); border-radius: 30px; padding: 16px 18px 20px;
  color: var(--ink); text-decoration: none; min-height: 250px;
  box-shadow: 0 8px 0 var(--ink);
  transition: transform .15s ease, box-shadow .15s ease;
}
a.tile:hover { transform: translateY(-3px) rotate(-.6deg); box-shadow: 0 11px 0 var(--ink); }
a.tile:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
a.tile:focus-visible, .player-chip:focus-visible, button:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.tile .art { flex: 1; display: grid; place-items: center; min-height: 140px; }
.tile .art svg { width: 100%; max-width: 230px; height: auto; }
.tile h2 { margin: 0; font: 800 1.9rem/1 var(--display); }
.tile p { margin: 0; font-weight: 800; font-size: 1rem; }
.tile .badge {
  position: absolute; top: -14px; right: 16px;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 999px;
  padding: 4px 12px; font: 800 .95rem var(--body);
}
.tile[data-game] { background: var(--tile); }
.tile.coming { filter: saturate(.35); opacity: .8; box-shadow: 0 8px 0 rgba(42,35,64,.5); }
.tile.coming .badge { background: #fff; }
.tile.soon {
  background: rgba(255, 248, 236, .55); border-style: dashed; box-shadow: none; color: var(--muted);
  justify-content: center; align-items: center; text-align: center;
}
.tile.soon h2 { font-size: 1.5rem; }

.foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; text-align: center; font-weight: 800; color: var(--ink); font-size: .95rem; margin: 8px 0 0; }
.foot-note { display: inline-flex; align-items: center; gap: 8px; opacity: .75; }
.site-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding-top: 24px; }
.foot-link.pass-link { background: var(--sun); }
.tile .pass-chip {
  position: absolute; top: 12px; left: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 4px;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 2px 10px; font: 800 .9rem var(--body); color: var(--ink);
}
.foot-link { color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; font-size: .95rem; text-decoration: none; padding: 10px 18px; }
.foot-link:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.foot-link:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; border-radius: 8px; }

/* Who's playing overlay */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(42, 35, 64, .55);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.panel {
  width: min(560px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 30px;
  box-shadow: 0 8px 0 var(--ink); padding: 22px; display: flex; flex-direction: column; gap: 18px;
}
.panel h2 { margin: 0; font: 800 2rem/1 var(--display); text-align: center; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; }
.person {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 12px 8px;
  font: 800 1.1rem var(--body); color: var(--ink); cursor: pointer; min-height: 130px; justify-content: center;
  word-break: break-word;
}
.person.selected { background: #FFF1B8; }
.person svg { width: 72px; height: 72px; }
.person.add { border-style: dashed; background: transparent; }
.plus { width: 64px; height: 64px; border-radius: 50%; background: var(--grass); border: 3px solid var(--ink); display: grid; place-items: center; font: 800 2.4rem/1 var(--display); color: var(--ink); }
.del {
  position: absolute; top: -10px; right: -10px; width: 40px; height: 40px; border-radius: 50%;
  border: 3px solid var(--ink); background: var(--tomato); color: #fff; font: 800 1.2rem/1 var(--body); cursor: pointer;
}
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn {
  min-height: 58px; padding: 0 24px; border-radius: 999px; border: 3px solid var(--ink);
  font: 800 1.15rem var(--body); color: var(--ink); background: var(--sun); cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.plain { background: #fff; }
.btn.go { background: var(--grass); }
.btn.warn { background: var(--tomato); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
label.lab { font-weight: 800; font-size: 1.05rem; display: block; margin-bottom: 8px; }
#nameInput {
  width: 100%; min-height: 60px; border: 3px solid var(--ink); border-radius: 18px; padding: 0 16px;
  font: 800 1.4rem var(--body); color: var(--ink); background: #fff;
}
.pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pick button { aspect-ratio: 1; border: 3px solid transparent; border-radius: 50%; background: none; padding: 2px; cursor: pointer; min-width: 44px; }
.pick button svg { width: 100%; height: 100%; }
.pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--sun); }
.swatches button { border-radius: 50%; aspect-ratio: 1; border: 3px solid var(--ink); cursor: pointer; min-width: 44px; }
.swatches button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
.note { margin: 0; text-align: center; font-weight: 700; color: var(--muted); font-size: .95rem; }
.confirm-text { margin: 0; text-align: center; font: 800 1.3rem var(--body); }

@media (prefers-reduced-motion: reduce) {
  .cloud1, .cloud2, .mascot, .mascot .wave { animation: none; }
  .tile, .btn, .player-chip { transition: none; }
}
</style>

<script>
(function () {
  var chip = document.getElementById('playerChip');
  var greet = document.getElementById('greeting');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');
  var editing = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function renderHeader() {
    var p = GG.current();
    if (p) {
      chip.innerHTML = GG.avatarSVG(p.avatar, p.color, 46) + '<span>' + esc(p.name) + '</span>';
      greet.textContent = 'Hi ' + p.name + '! Pick a game.';
    } else {
      chip.innerHTML = '<span class="plus" style="width:46px;height:46px;font-size:1.8rem">+</span><span>Who’s playing?</span>';
      greet.textContent = 'Pick a game.';
    }
    GGGames.all.forEach(function (g) {
      var b = document.querySelector('.tile[data-game="' + g.id + '"] .badge');
      if (!b || !g.badge) return;
      var txt = g.badge(GG.getProgress(g.save));
      b.hidden = !txt; b.textContent = txt;
    });
  }

  function open() { overlay.hidden = false; }
  function close() { overlay.hidden = true; editing = false; renderHeader(); }

  function showPeople() {
    var list = GG.players();
    var cur = GG.current();
    panel.classList.add('whos');
    var html = '<svg class="peek" viewBox="0 0 170 136" aria-hidden="true"><path d="M30 60 L26 18 L62 38 Z" fill="#fff" stroke="#2A2340" stroke-width="5" stroke-linejoin="round"/><path d="M130 60 L134 18 L98 38 Z" fill="#FFB26B" stroke="#2A2340" stroke-width="5" stroke-linejoin="round"/><path d="M34 48 L32 28 L50 39 Z" fill="#FFB3C7"/><path d="M126 48 L128 28 L110 39 Z" fill="#FFB3C7"/><ellipse cx="80" cy="80" rx="60" ry="48" fill="#fff"/><path d="M104 38 Q132 40 139 70 Q122 64 108 60 Q100 50 104 38 Z" fill="#FFB26B"/><ellipse cx="80" cy="80" rx="60" ry="48" fill="none" stroke="#2A2340" stroke-width="5"/><circle cx="60" cy="78" r="6" fill="#2A2340"/><circle cx="100" cy="78" r="6" fill="#2A2340"/><circle cx="62" cy="76" r="2" fill="#fff"/><circle cx="102" cy="76" r="2" fill="#fff"/><ellipse cx="46" cy="94" rx="9" ry="5.5" fill="#FF8FAB"/><ellipse cx="114" cy="94" rx="9" ry="5.5" fill="#FF8FAB"/><path d="M72 92 Q76 98 80 92 Q84 98 88 92" fill="none" stroke="#2A2340" stroke-width="3.5" stroke-linecap="round"/><g stroke="#2A2340" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="86" x2="38" y2="89"/><line x1="24" y1="97" x2="38" y2="96"/><line x1="138" y1="86" x2="122" y2="89"/><line x1="136" y1="97" x2="122" y2="96"/></g><g fill="#fff" stroke="#2A2340" stroke-width="4.5"><ellipse cx="46" cy="122" rx="20" ry="13"/><ellipse cx="114" cy="122" rx="20" ry="13"/></g><g stroke="#2A2340" stroke-width="3" stroke-linecap="round"><line x1="40" y1="128" x2="40" y2="134"/><line x1="52" y1="128" x2="52" y2="134"/><line x1="108" y1="128" x2="108" y2="134"/><line x1="120" y1="128" x2="120" y2="134"/></g></svg><h2 id="panelTitle">Who\u2019s playing?</h2><div class="people">';
    list.forEach(function (p) {
      html += '<div class="person' + (cur && cur.id === p.id ? ' selected' : '') + '" role="button" tabindex="0" data-id="' + p.id + '">' +
        GG.avatarSVG(p.avatar, p.color, 72) + '<span>' + esc(p.name) + '</span>' +
        (editing ? '<button class="del" type="button" data-del="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">✕</button>' : '') +
        '</div>';
    });
    html += '<button class="person add" type="button" id="addBtn"><span class="plus">+</span><span>New player</span></button></div>';
    html += '<div class="row">' + (list.length ? '<button class="btn plain" type="button" id="editBtn">' + (editing ? 'Done' : 'Edit players') + '</button>' : '') +
      (cur ? '<button class="btn go" type="button" id="closeBtn">Play!</button>' : '') + '</div>';
    html += '<p class="note">Players are saved only on this device. No sign-up needed.</p>';
    panel.innerHTML = html;
    open();

    panel.querySelectorAll('.person[data-id]').forEach(function (el) {
      function choose(e) {
        if (e.target.closest('.del')) return;
        if (editing) return;
        GG.setCurrent(el.dataset.id); close();
      }
      el.addEventListener('click', choose);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(e); } });
    });
    panel.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); confirmRemove(b.dataset.del); });
    });
    document.getElementById('addBtn').addEventListener('click', function () { editing = false; showAdd(); });
    var eb = document.getElementById('editBtn'); if (eb) eb.addEventListener('click', function () { editing = !editing; showPeople(); });
    var cb = document.getElementById('closeBtn'); if (cb) cb.addEventListener('click', close);
  }

  function confirmRemove(id) {
    var p = GG.players().filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    panel.innerHTML = '<h2 id="panelTitle">Remove ' + esc(p.name) + '?</h2>' +
      '<div class="row">' + GG.avatarSVG(p.avatar, p.color, 96) + '</div>' +
      '<p class="confirm-text">Their saved dishes will be removed too.</p>' +
      '<div class="row"><button class="btn plain" type="button" id="noBtn">Keep</button><button class="btn warn" type="button" id="yesBtn">Remove</button></div>';
    document.getElementById('noBtn').addEventListener('click', showPeople);
    document.getElementById('yesBtn').addEventListener('click', function () { GG.removePlayer(id); showPeople(); });
  }

  function showAdd() {
    var avatar = GG.AVATARS[Math.floor(Math.random() * GG.AVATARS.length)];
    var color = GG.COLORS[Math.floor(Math.random() * GG.COLORS.length)];
    panel.innerHTML = '<h2 id="panelTitle">New player</h2>' +
      '<div><label class="lab" for="nameInput">Your name</label><input id="nameInput" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false"></div>' +
      '<div><span class="lab">Pick an animal</span><div class="pick" id="pickAnimal"></div></div>' +
      '<div><span class="lab">Pick a colour</span><div class="pick swatches" id="pickColor"></div></div>' +
      '<div class="row"><button class="btn plain" type="button" id="backBtn">Back</button><button class="btn go" type="button" id="saveBtn" disabled>Save</button></div>';
    var pa = document.getElementById('pickAnimal'), pc = document.getElementById('pickColor');
    var input = document.getElementById('nameInput'), save = document.getElementById('saveBtn');
    function draw() {
      pa.innerHTML = GG.AVATARS.map(function (a) { return '<button type="button" aria-label="' + a + '" aria-pressed="' + (a === avatar) + '" data-a="' + a + '">' + GG.avatarSVG(a, color, 56) + '</button>'; }).join('');
      pc.innerHTML = GG.COLORS.map(function (c) { return '<button type="button" aria-label="colour" aria-pressed="' + (c === color) + '" data-c="' + c + '" style="background:' + c + '"></button>'; }).join('');
      pa.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { avatar = b.dataset.a; draw(); }); });
      pc.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { color = b.dataset.c; draw(); }); });
    }
    draw();
    input.addEventListener('input', function () { save.disabled = !input.value.trim(); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && input.value.trim()) save.click(); });
    document.getElementById('backBtn').addEventListener('click', function () { if (GG.players().length) showPeople(); else showPeople(); });
    save.addEventListener('click', function () { GG.addPlayer(input.value.trim(), avatar, color); close(); });
    setTimeout(function () { input.focus(); }, 50);
  }

  chip.addEventListener('click', showPeople);
  var EAR = '<svg class="ear l" viewBox="0 0 60 44" aria-hidden="true"><path d="M2 48 L20 6 Q25 0 31 6 L58 48 Z" fill="var(--tile)"/><path d="M2 46 L20 6 Q25 0 31 6 L58 46" fill="none" stroke="#2A2340" stroke-width="4" stroke-linejoin="round"/><path d="M16 40 L25 16 L42 40 Z" fill="#FF8FAB" opacity=".75"/></svg>';
  function renderTiles() {
    var box = document.getElementById('tiles'), sleepy = box.querySelector('.tile.soon');
    GGGames.visible().forEach(function (g) {
      var ok = GGGames.playable(g);
      var t = document.createElement(ok ? 'a' : 'div');
      t.className = 'tile' + (ok ? '' : ' coming');
      t.dataset.game = g.id;
      t.style.setProperty('--tile', g.colour);
      if (ok) t.href = 'games/' + g.id + '/index.html';
      else t.setAttribute('aria-label', g.name + ', coming soon');
      t.innerHTML = EAR + EAR.replace('ear l', 'ear r') +
        '<span class="badge"' + (ok ? ' hidden' : '') + '>' + (ok ? '' : 'Coming soon') + '</span>' +
        '<div class="art" aria-hidden="true">' + g.art + '</div><h2>' + esc(g.name) + '</h2><p>' + esc(g.blurb) + '</p>';
      if (ok) t.addEventListener('click', function (e) {
        if (!GG.current() && GG.players().length) { e.preventDefault(); showPeople(); }
      });
      box.insertBefore(t, sleepy);
    });
  }
  renderTiles();
  overlay.addEventListener('click', function (e) { if (e.target === overlay && GG.current()) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden && GG.current()) close(); });
  window.addEventListener('pageshow', function () { GG.reload(); renderHeader(); });

  renderHeader();
  GGInstall.banner(document.getElementById('installBanner'));
  if (!GG.current()) showPeople();
})();
</script>
<script>
/* one-year pass: padlocks on games that need it, and an "Unlock all games" button (see shared/pass.js) */
window.addEventListener('ggpass', function (e) {
  var st = e.detail, P = window.GGPass;
  var link = document.getElementById('passLink');
  link.hidden = !st.required && !st.signedIn;
  link.textContent = st.unlocked ? (st.signedIn ? 'Your pass' : 'Unlock all games') : 'Unlock all games';
  if (!st.required) link.hidden = !st.signedIn;
  document.querySelectorAll('a.tile[href*="games/"]').forEach(function (t) {
    var slug = (t.getAttribute('href').match(/games\/([^\/]+)\//) || [])[1];
    var chip = t.querySelector('.pass-chip');
    var fully = slug && P.FREE[slug] === undefined && !st.unlocked;
    var partly = slug && P.FREE[slug] !== undefined && !st.unlocked;
    if (!fully && !partly) { if (chip) chip.remove(); return; }
    if (!chip) { chip = document.createElement('span'); chip.className = 'pass-chip'; t.appendChild(chip); }
    chip.innerHTML = fully ? '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="3" fill="#2A2340"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#2A2340" stroke-width="2.6"/></svg>Needs a pass' : 'Free to try';
  });
});
</script>
